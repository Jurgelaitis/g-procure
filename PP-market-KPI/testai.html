<script>
/* Tikri naudotojo duomenys (testai viešu adresu - ta pati naršyklės saugykla kaip moduliui):
   įsimenami prieš įkeliant modulį ir atkuriami pabaigoje bei uždarant puslapį. Iki 2026-09-26
   paruosk() juos tiesiog ištrindavo. */
const APSAUGA = GP_TESTU_APSAUGA.pradek(k => k.indexOf("epsog_rinkos_kpi") === 0 || k === "ppmarket.lang");
/* =========================================================================
   TESTŲ VARIKLIS

   Dvi taisyklės, kurių laikomasi ir kurios abi kainavo klaidingą „raudoną" gyvai:
   1. Rėmelio src nustatomas IŠ JS su kešo skirtuku - kitaip naršyklė pakrauna
      kešuotą modulio versiją ir tikrinamas ne tas kodas.
   2. Testai NIEKADA nesiremia tuo, kas liko localStorage - kiekvienas pradeda
      nuo paruosk(), kuris išvalo įrašus ir atkuria pradinę būseną.

   DATA ir kitos konstantos modulyje paskelbtos su const/let, todėl jos NĖRA
   window savybės. Prie jų einame per M() - eval rėmelio globalioje srityje.
   Funkcijos (function ...) yra window savybės, tad jas galima kviesti tiesiai.
   ========================================================================= */
const ramas = document.getElementById("modulis");
const TESTAI = [];
function testas(grupe, pav, fn){ TESTAI.push({grupe, pav, fn}); }

function M(israiska){ return ramas.contentWindow.eval(israiska); }

function paruosk(){
  const w = ramas.contentWindow;
  try{
    Object.keys(w.localStorage)
      .filter(k => k.indexOf("epsog_rinkos_kpi") === 0 || k === "ppmarket.lang")
      .forEach(k => w.localStorage.removeItem(k));
  }catch(e){}
  // Kalba TAIP PAT gyvena localStorage, tad ji reikia grąžinti kaip ir duomenis -
  // kitaip testai priklausytų nuo to, kurią kalbą paskutinį kartą buvai pasirinkęs.
  M('LANG = "lt"; applyI18n(); DATA = loadData(); renderAll();');
  // Pirkimo kortele gyvena uz renderAll ribu (FOCUS + #focusResult), o pavadinimas
  // atsikartoja ir profiliu tinklelyje - be sito jis persikeltu i kita testa.
  M('FOCUS.name = ""; FOCUS.last = null; FOCUS.rusis = null; FOCUS.rusisKilme = null; FOCUS.catRanka = false; FOCUS.veiksmai = {}; FOCUS.veiksmaiIs = null; document.getElementById("focusName").value = ""; document.getElementById("focusResult").innerHTML = ""; renderAll();');
  return w;
}

function lygu(gauta, laukta, ka){
  const a = JSON.stringify(gauta), b = JSON.stringify(laukta);
  if(a !== b) throw new Error((ka ? ka + ": " : "") + "gauta " + a + ", laukta " + b);
}
function tiesa(salyga, ka){ if(!salyga) throw new Error(ka || "sąlyga neteisinga"); }

/* =========================================================================
   1. NEKINTAMOS TAISYKLĖS
   Jos yra naudotojo sprendimai ir VPT metodikos reikalavimai, ne stiliaus
   klausimas. Jei testas krinta - taisyk kodą, o ne testą.
   ========================================================================= */
testas("Nekintamos taisyklės", "VMDU niekada nesiūlomas šalia SSKI (visos 24 kombinacijos)", ()=>{
  paruosk();
  const blogos = M(`(function(){
    const bl = [];
    DATA.categories.map(c=>c.id).forEach(p=>["darbai","prekes","paslaugos"].forEach(r=>{
      const mod = indeksavimoModelis(p, r);
      if(!mod){ bl.push("nėra modelio: " + p + "/" + r); return; }
      const ids = mod.kandidatai.map(k => k.metricId || "paslaugu_ki");
      if(ids.some(x => String(x).indexOf("sski") === 0) && ids.indexOf("vmdu") >= 0) bl.push(p + "/" + r);
    }));
    return bl;
  })()`);
  lygu(blogos, [], "kombinacijos su VMDU šalia SSKI");
});

testas("Nekintamos taisyklės", "Indeksavimo kandidatai neturi svorių", ()=>{
  paruosk();
  const blogi = M(`(function(){
    const bl = [];
    DATA.categories.map(c=>c.id).forEach(p=>["darbai","prekes","paslaugos"].forEach(r=>{
      ((indeksavimoModelis(p, r) || {}).kandidatai || []).forEach(k=>{
        Object.keys(k).forEach(f=>{ if(/svor|weight|proc|dalis/i.test(f)) bl.push(p + "/" + r + "/" + f); });
      });
    }));
    return bl;
  })()`);
  lygu(blogi, [], "kandidatų laukai, kurie atrodo kaip svoriai");
});

testas("Nekintamos taisyklės", "Kiekvienas profilis turi raktažodžius, modelį ir svorius, kurių suma 1,00", ()=>{
  paruosk();
  const bl = M(`(function(){
    const bl = [], ids = DATA.categories.map(c=>c.id);
    DATA.categories.forEach(c=>{
      if(!CAT_KEYWORDS[c.id]) bl.push("be raktažodžių: " + c.id);
      if(!indeksavimoModelis(c.id, "prekes")) bl.push("be modelio: " + c.id);
      const suma = Object.values(c.weights).reduce((a,b)=>a+b, 0);
      if(Math.abs(suma - 1) > 0.005) bl.push(c.id + " svorių suma " + suma.toFixed(3));
      Object.keys(c.weights).forEach(k=>{ if(!metricById(k)) bl.push(c.id + " nežinomas rodiklis " + k); });
    });
    Object.keys(CAT_KEYWORDS).forEach(k=>{ if(ids.indexOf(k) < 0) bl.push("perteklinis raktažodžių rinkinys: " + k); });
    return bl;
  })()`);
  lygu(bl, []);
});

testas("Indeksavimo modelis", "Visos 24 kombinacijos duoda kandidatų ir tekstą", ()=>{

  const bl = M(`(function(){
    const bl = [];
    DATA.categories.map(c=>c.id).forEach(p=>["darbai","prekes","paslaugos"].forEach(r=>{

});

/* Kai duomenys pasene, gretimas laikotarpis nebera siandiena. Realus atvejis: liepos 11 d.
   irasas rugsejo 8 d. siulydavo tik liepos 18 d., tad ivesta reiksme atsidurdavo liepoje ir
   skydelis atrodydavo nepasikeites; pasivyti reikejo astuoniu issaugojimu is eiles. */
function pasenkRodikli(id, zingsniu){
  M(`(function(){
    const m = metricById(${JSON.stringify(id)});
    m.laikotarpis = slinktiLaikotarpi(dabartinisLaikotarpis(m), m.zingsnis, -${zingsniu});
    renderAll();
  })()`);
}

/* Sendinam tik dalį rodiklių: „auto" - tuos, kuriuos atnaujina jungtis (OSP + proxy),
   „rankiniai" - likusius keturis, kuriems nemokamo šaltinio nėra. */
function pasenkDali(kuriuos, zingsniu){
  M(`(function(){
    const auto = m => !!((window.GP_OSP && GP_OSP.RODIKLIAI[m.id]) || (window.GP_RINKA && GP_RINKA.RODIKLIAI[m.id]));
    DATA.metrics.forEach(m=>{
      m.demo = false;
      const sen = ("${kuriuos}" === "auto") === auto(m);
      m.laikotarpis = sen ? slinktiLaikotarpi(dabartinisLaikotarpis(m), m.zingsnis, -${zingsniu}) : dabartinisLaikotarpis(m);
    });
    DATA.meta.demo = false;
    renderAll();
  })()`);
}

      let rules; try{ rules = ss.cssRules; }catch(e){ return; }
      [...(rules || [])].forEach(r=>{
        if(r.type === CSSRule.MEDIA_RULE && String(r.conditionText).indexOf("print") >= 0){

/* Diakritikos patikra nepagauna lietuvisku zodziu be jos („augimas", „nuo") -
   butent taip pirkimo kortele liko pusiau lietuviska. Cia tikrinami zodziai. */
const LT_BE_DIAKRITIKU = ["augimas","kritimas","lygis","pokytis","nuo","iki","prie","apie",
  "arba","kaina","kainos","rinka","rinkos","pirkimas","pirkimo","duomenys","duomenu",
  "atnaujinta","atsauktas","eksportuoti","ikelti","reiksme","reiksmes","laikotarpiai",
  "veiksmas","laikotarpis","dabar","naujas","taisyti","spalva","busena"];

// Grazina lietuviskus likucius: ir diakritikas, ir zodzius be jos.
function ltLikutis(w, ignoruoti){
  const zodziai = JSON.stringify(LT_BE_DIAKRITIKU);
  // Įstatymų santrumpos (VPĮ, PĮ) EN tekste lieka lietuviškos - modulio taisyklė (teisės nuorodos - GP_TEISE.cit(..., "en"))
  const ign = JSON.stringify((ignoruoti || []).concat(["VPĮ", "PĮ"]));
  return w.eval(`(function(){
    const zod = ${zodziai}, ign = ${ign}, out = [];
    document.querySelectorAll("body *").forEach(el=>{
      if(el.tagName === "SCRIPT" || el.tagName === "STYLE") return;
      // Bendra portalo juosta (shared/portal-link.js) ir trumpi pranešimai (shared/pranesimas.js)
      // nėra modulio turinys - jie verčiasi (pranešimai - nuimami) patys ir tikrinami
      // shared/testai.html. Be to, jie atsinaujina mikroužduotimi po <html lang> pakeitimo,
      // tad čia dar būtų senas tekstas.
      if(el.closest("#gp-portalas, .gp-pranesimai, .gp-sr-pranesimai, #gpk")) return;   // #gpk - pirkimo kortelės juosta (shared), persipiešia mikroužduotimi
      const st = getComputedStyle(el);
      if(st.display === "none" || st.visibility === "hidden") return;
      [...el.childNodes].filter(n=>n.nodeType === 3).forEach(n=>{
        let v = n.textContent.trim();
        if(!v) return;
        ign.forEach(x=>{ v = v.split(x).join(" "); });
        if(/[\u0105\u010D\u0119\u0117\u012F\u0161\u0173\u016B\u017E]/i.test(v)){ out.push(v.slice(0, 60)); return; }
        const rasta = v.toLowerCase().split(/[^a-z0-9]+/).filter(x=>zod.indexOf(x) >= 0);
        if(rasta.length) out.push(rasta[0] + " -> " + v.slice(0, 60));
      });
    });
    return [...new Set(out)];
  })()`);
}

const lauk = ms => new Promise(r => setTimeout(r, ms));
async function laukIki(f, ms){ const t0 = Date.now(); while(Date.now() - t0 < (ms || 3000)){ if(f()) return true; await lauk(25); } return false; }
/* Netikra kortelių saugykla ir kortelės juosta (tikros kortelės nenaudojamos). */
function kortelesPakaitalas(korteleObj){
  M(`window.__T = { tikra: KORTELE, saug: (function(){ const d = {}; return { get length(){ return Object.keys(d).length; }, key: i => Object.keys(d)[i] || null,
      getItem: k => Object.prototype.hasOwnProperty.call(d, k) ? d[k] : null, setItem: (k, v) => { d[k] = String(v); }, removeItem: k => { delete d[k]; } }; })() };
    GP_KORTELE.naudokSaugykla(__T.saug);
    __T.k = GP_KORTELE.issaugok(${JSON.stringify(korteleObj)}).kortele;
    KORTELE = { pasirinkta: () => __T.k ? GP_KORTELE.gauk(__T.k.id) : null, atnaujink: () => {}, pasirink: () => Promise.resolve(true), atsiek: () => {},
                skirtumai: () => { __T.skirtumai = (__T.skirtumai || 0) + 1; return null; }, pritaikyk: () => null };`);
}
function kortelesAtkurk(){ M('if(window.__T){ KORTELE = __T.tikra; GP_KORTELE.naudokSaugykla(null); delete window.__T; }'); }
/* Visi rodikliai - tikri ir šio laikotarpio (be iliustracinių ir be ankstesnio laikotarpio). */
function visiTikri(){
  M(`DATA.metrics.forEach(m => { m.demo = false; m.laikotarpis = dabartinisLaikotarpis(m); }); DATA.meta.demo = false; renderAll();`);
}
function kopijuok(f){
  return M(`(function(){ let tekstas = ""; const o = GP_KOPIJA.kopijuok; GP_KOPIJA.kopijuok = v => { tekstas = v; return Promise.resolve(true); };
    try { ${f}; } finally { GP_KOPIJA.kopijuok = o; } return tekstas; })()`);
}

// Testas gali grąžinti Promise (nuo 2026-10-27 - importas, atnaujinimas iš šaltinių, kortelės juosta): laukiama jo pabaigos.
async function paleisk(){
  const host = document.getElementById("rezultatai");
  const grupes = [];
  TESTAI.forEach(t=>{ if(grupes.indexOf(t.grupe) < 0) grupes.push(t.grupe); });

  let ok = 0, krito = 0;
  host.innerHTML = "";
  for(const g of grupes){
    const h = document.createElement("h2");
    h.textContent = g;
    host.appendChild(h);
    const lentele = document.createElement("table");
    host.appendChild(lentele);
    for(const t of TESTAI.filter(x=>x.grupe === g)){
      const t0 = performance.now();
      let klaida = null;
      try{ const rez = t.fn(); if(rez && typeof rez.then === "function") await rez; }catch(e){ klaida = e && e.message ? e.message : String(e); }
      const ms = Math.round(performance.now() - t0);
      if(klaida) krito++; else ok++;
      const tr = document.createElement("tr");
      tr.innerHTML =
        '<td class="b"><span class="zenklas ' + (klaida ? "z-blogai" : "z-ok") + '">' +
        (klaida ? "krito" : "gerai") + "</span></td>" +
        "<td>" + t.pav.replace(/&/g, "&amp;").replace(/</g, "&lt;") +
        (klaida ? '<div class="klaida">' + klaida.replace(/&/g, "&amp;").replace(/</g, "&lt;") + "</div>" : "") +
        '</td><td class="laikas">' + ms + " ms</td>";
      lentele.appendChild(tr);
    }
  }

  const s = document.getElementById("santrauka");
  s.innerHTML =
    '<span class="zenklas ' + (krito ? "z-blogai" : "z-ok") + '">' + (krito ? "yra kritusių" : "viskas gerai") + "</span> " +
    "<b>" + ok + " / " + (ok + krito) + "</b> testų praėjo" +
    (krito ? " · <b>" + krito + "</b> krito" : "");
  document.title = (krito ? "KRITO " + krito + " · " : "OK · ") + "Rinkos rodiklių stebėsenos testai";
  APSAUGA.atkurk();
}

/* Kešo skirtukas BŪTINAS: be jo naršyklė pakrauna kešuotą modulį ir testai
   tikrina ne tą kodą (ši klaida jau kartą davė 11 klaidingų „raudonų"). */
ramas.addEventListener("load", ()=> setTimeout(paleisk, 300));
ramas.src = "./EPSO-G_Rinkos_KPI_skydelis.html?testas=" + Date.now();
