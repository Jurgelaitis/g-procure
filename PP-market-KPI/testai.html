<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pirkimo rinkos apžvalga - regresijos testai</title>
<link rel="stylesheet" href="../shared/epso-g.css">
<style>
body{font-family:var(--font-base);color:var(--color-graphite);background:var(--color-graphite-5);margin:0;padding:24px;font-size:14px}
h1{font-size:22px;margin:0 0 4px} .sub{color:var(--color-graphite-50);margin-bottom:16px;max-width:820px}
.santr{background:#fff;border:1px solid var(--color-graphite-15);border-radius:12px;padding:14px 18px;margin-bottom:16px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.n{font-size:22px;font-weight:800}.ok{color:var(--color-emerald-120)}.blogai{color:var(--color-error)}
.gr{background:#fff;border:1px solid var(--color-graphite-15);border-radius:12px;padding:12px 16px;margin-bottom:12px}
.gr h2{font-size:15px;margin:0 0 8px}
.t{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--color-graphite-15);align-items:flex-start}
.t:last-child{border-bottom:none}
.z{font-weight:800;min-width:52px;font-size:12px;padding:2px 8px;border-radius:999px;text-align:center}
.t.ok .z{background:var(--color-green-5);color:var(--color-emerald-120)} .t.blogai .z{background:var(--color-error-5);color:var(--color-error)}
.det{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--color-error);white-space:pre-wrap;margin-top:4px}
.p{color:var(--color-graphite-50);font-size:12.5px}
iframe{width:1px;height:1px;opacity:0;position:absolute}
</style>
</head>
<body>
<h1>Pirkimo rinkos apžvalga - regresijos testai</h1>
<p class="sub">Tikrina klasifikatorių (visi audito kontrpavyzdžiai), vertinimo logiką, SDMX skaitymą ir
nekintamas indeksavimo taisykles. Tinklo užklausų nedaro - OSP atsakymas imituojamas.
Paleisti per http serverį iš repo šaknies.</p>
<div class="santr"><span class="n ok" id="nok">0</span> praėjo <span class="n blogai" id="nbl">0</span> krito
  <span id="busena" class="p">Kraunama...</span></div>
<div id="rez"></div>
<iframe id="ramas" title="modulis"></iframe>
<script>
let W, R;
const S={ok:0,bl:0}; let grEl=null;
const esc=s=>String(s).replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));
function gr(p){ grEl=document.createElement("div"); grEl.className="gr"; grEl.innerHTML="<h2>"+esc(p)+"</h2>"; document.getElementById("rez").appendChild(grEl); }
function t(pav, fn, past){
  let kl=null;
  try{ fn(); }catch(e){ kl = e && e.message ? e.message : String(e); }
  const el=document.createElement("div"); el.className="t "+(kl?"blogai":"ok");
  el.innerHTML='<span class="z">'+(kl?"KRITO":"OK")+'</span><div><div>'+esc(pav)+'</div>'+
    (past?'<div class="p">'+esc(past)+'</div>':'')+(kl?'<div class="det">'+esc(kl)+'</div>':'')+'</div>';
  grEl.appendChild(el); kl?S.bl++:S.ok++;
  document.getElementById("nok").textContent=S.ok; document.getElementById("nbl").textContent=S.bl;
}
function tiesa(c,m){ if(!c) throw new Error(m||"tikėtasi true"); }
function lygu(a,b,m){ const x=JSON.stringify(a), y=JSON.stringify(b); if(x!==y) throw new Error((m||"")+"\n  tikėtasi: "+y+"\n  gauta:    "+x); }

function paleisk(){
  /* ---------------- KLASIFIKATORIUS ---------------- */
  gr("Klasifikatorius: audito kontrpavyzdžiai (visi buvo klasifikuojami klaidingai)");
  const K=[
    ["Matlab ir Simulink programinės įrangos palaikymo paslaugos","paslaugos","licencijos","buvo: statyba (fragmentas „rang“ žodyje „įrangos“)"],
    ["Kabelių faktinių pralaidumų skaičiavimo programinės įrangos licencijos pratęsimas","prekes","licencijos","buvo: kabeliai"],
    ["110/10 kV Nemenčinės TP 110 kV skirstyklos rekonstravimo projekto priežiūros vykdymas","paslaugos","projektavimas","buvo: transformatoriai"],
    ["Transporto parkui atsarginės dalys ir kitos dalys","prekes","bendra","buvo: transformatoriai"],
    ["Statybos darbų žurnalai, eksploatacijos žurnalai, pasai","prekes","bendra","buvo: statyba"],
    ["Harmony Link šuntinių reaktorių įsigijimo techninio tinkamumo studijos paslaugos","paslaugos","projektavimas","buvo: transformatoriai"],
    ["Statinio statybos techninio prižiūrėtojo civilinės atsakomybės draudimas","paslaugos","draudimas","buvo: statyba"],
    ["RAA prietaisai ir elektroninė įranga","prekes","raa_ot","buvo: statyba"],
    ["Relinės apsaugos ir automatikos apsaugų komplektai","prekes","raa_ot","buvo: nepriskirta"],
    ["110-400 kV skyrikliai","prekes","iranga","buvo: nepriskirta"],
    ["Elektros sistemos adekvatumo studija","paslaugos","projektavimas","buvo: IT"],
    ["Pastotės įrenginių išdėstymo projektavimas","paslaugos","projektavimas","buvo: transformatoriai"],
    ["Balansavimo rinkos IT sprendinio kūrimas","paslaugos","licencijos","buvo: nepriskirta"]
  ];
  K.forEach(([n,r,laukta,past])=>{
    t("„"+n.slice(0,58)+(n.length>58?"...":"")+"“ -> "+laukta, ()=>{
      lygu(R.klasifikuok(n,r).profilis, laukta, "neteisingas profilis");
    }, past);
  });

  gr("Klasifikatorius: darbų kalba (70 proc. vertės)");
  [["330 kV OL Alytus-Gardinas demontavimo darbai","darbai","statyba"],
   ["Šilainių TP sekcijinio jungtuvo įrengimo darbai","darbai","statyba"],
   ["LitPol link jungties pertvarkymas po sinchronizacijos rangos darbų pirkimas","darbai","statyba"],
   ["Rytų regiono 110-400 kV oro linijų eksploatavimo darbai","darbai","eksploatacija"],
   ["Akumuliatorių baterijų ir įkroviklių keitimas","darbai","eksploatacija"],
   ["Alytaus TP vaizdo stebėjimo modernizavimo darbai","darbai","raa_ot"],
   ["110/10 kV Riešės TP 110 kV skirstyklos rekonstravimo darbai","darbai","statyba"]
  ].forEach(([n,r,l])=> t("„"+n.slice(0,52)+"“ -> "+l, ()=> lygu(R.klasifikuok(n,r).profilis, l)));

  gr("Klasifikatorius: žodžio riba ir neaiškūs atvejai");
  t("„įrangos“ NEatpažįstama kaip „rang“ (statyba)", ()=>{
    tiesa(R.zodziai("programinės įrangos licencija").indexOf("įrangos")>=0, "tokenizavimas");
    lygu(R.klasifikuok("Programinės įrangos priežiūra","paslaugos").profilis, "licencijos");
  }, "būtent ši klaida raudonai vertindavo Matlab licenciją kaip statybą");
  t("Rūšis riboja profilius: „skyrikliai“ kaip darbai nepatenka į įrangą", ()=>{
    lygu(R.klasifikuok("110-400 kV skyrikliai","prekes").profilis, "iranga");
    const d = R.klasifikuok("110 kV skyriklių keitimo darbai","darbai").profilis;
    tiesa(d !== "iranga", "įranga yra tik prekių profilis, gauta: "+d);
  });
  t("Tuščias pavadinimas negrąžina profilio", ()=>{
    lygu(R.klasifikuok("","darbai").profilis, "");
    lygu(R.klasifikuok("   ","").tikrumas, "nera");
  });
  t("Nežinomas pavadinimas pažymimas kaip nepriskirtas, o ne atspėjamas", ()=>{
    const k=R.klasifikuok("Zzz qqq vvv","prekes");
    lygu(k.profilis, ""); lygu(k.tikrumas, "nera");
  });

  /* ---------------- VERTINIMAI ---------------- */
  gr("Vertinimas: duomenų trūkumas nėra „žalia“");
  t("Demonstracinis rodiklis grąžina „nepatikrinta“, ne „stabilu“", ()=>{
    const m={demo:true, obs:[{p:"2025M01",v:100},{p:"2026M01",v:100}], langas:12, ribos:{geltona:3,raudona:8}};
    lygu(R.busena(m), "unk");
  }, "senoji versija tokį rodiklį laikydavo neutraliu ir jis nusverdavo į žalią");
  t("Per mažai stebėjimų -> „nepatikrinta“, pokytis neskaičiuojamas", ()=>{
    const m={demo:false, obs:[{p:"2026M01",v:100}], langas:12, ribos:{geltona:3,raudona:8}};
    lygu(R.pokytis(m), null); lygu(R.busena(m), "unk");
  });
  t("Nulinė bazė: pokytis neskaičiuojamas, o ne lygus nuliui", ()=>{
    const m={demo:false, obs:[{p:"2025M01",v:0},{p:"2026M01",v:50}], langas:1, ribos:{geltona:3,raudona:8}};
    lygu(R.pokytis(m), null);
  }, "senasis pctChange() grąžindavo 0 ir tai atrodydavo kaip stabilumas");
  t("Pokytis skaičiuojamas per nurodytą langą", ()=>{
    const m={demo:false, langas:2, ribos:{geltona:3,raudona:8},
             obs:[{p:"1",v:100},{p:"2",v:200},{p:"3",v:110}]};
    lygu(Math.round(R.pokytis(m)), 10, "turi lyginti su prieš 2 laikotarpius, ne su ankstesniu");
  });
  t("Ribos: geltona ir raudona pagal pokytį", ()=>{
    const mk=v=>({demo:false, langas:1, ribos:{geltona:3,raudona:8}, obs:[{p:"1",v:100},{p:"2",v:100+v}]});
    lygu(R.busena(mk(1)),"ok"); lygu(R.busena(mk(4)),"warn"); lygu(R.busena(mk(9)),"bad");
  });

  gr("Vertinimas: kaina, terminas, tiekėjai");
  t("Kaina ima blogiausią rodiklį, ne vidurkį", ()=>{
    const p=R.profilisPagalId("statyba");
    const sn=p.kainosRodikliai.map(id=>{ const m=R.rod(id); return {id, demo:m.demo, obs:m.obs}; });
    p.kainosRodikliai.forEach((id,i)=>{ const m=R.rod(id);
      m.demo=false; m.obs=[{p:"a",v:100},{p:"b",v: i===0 ? 120 : 100}]; m.langas=1; });
    lygu(R.vertinkKaina(p).b, "bad", "vienas raudonas rodiklis turi nulemti, o ne ištirpti");
    sn.forEach(x=>{ const m=R.rod(x.id); m.demo=x.demo; m.obs=x.obs; });
  }, "senoji versija vidurkindavo ir vienas raudonas signalas dingdavo");
  t("Visi rodikliai demonstraciniai -> kaina „nepatikrinta“", ()=>{
    const p={kainosRodikliai:["__nera__"]};
    lygu(R.vertinkKaina(p).b, "unk");
  });
  t("Terminas be datos - „nepatikrinta“, su datomis - skaičiuojama", ()=>{
    const p=R.profilisPagalId("iranga");
    lygu(R.vertinkTermina(p,"").b, "unk");
    const po = new Date(); po.setMonth(po.getMonth()+40);
    const iso = d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    lygu(R.vertinkTermina(p, iso(po)).b, "ok", "40 mėn. turi pakakti");
    const arti = new Date(); arti.setMonth(arti.getMonth()+2);
    lygu(R.vertinkTermina(p, iso(arti)).b, "bad", "2 mėn. iki poreikio - per mažai");
  });
  t("Tiekėjų pasirinkimas nerodomas kaip „stabilu“", ()=>{
    PROFILIAI_ID().forEach(id=>{
      const b=R.vertinkTiekejus(R.profilisPagalId(id)).b;
      tiesa(b==="warn"||b==="unk", id+" grąžino "+b);
    });
  }, "tiekėjų skaičius nėra matuojamas indeksais, todėl „žalios“ būsenos čia nėra");
  t("Duomenų kokybė skiria patikrintus nuo demonstracinių", ()=>{
    const p=R.profilisPagalId("statyba");
    const b=R.duomenuKokybe(p).b;
    tiesa(["ok","warn","unk"].indexOf(b)>=0, "netikėta būsena: "+b);
  });

  gr("Veiksmai");
  t("Ne daugiau kaip trys veiksmai, kiekvienas su „kodėl“ ir „kas“", ()=>{
    const p=R.profilisPagalId("statyba");
    const v={ kaina:R.vertinkKaina(p), term:R.vertinkTermina(p,""), tiek:R.vertinkTiekejus(p),
              kok:R.duomenuKokybe(p), blok:[] };
    const a=R.veiksmai(p,v);
    tiesa(a.length>0 && a.length<=3, "veiksmų kiekis: "+a.length);
    a.forEach(x=>{ tiesa(x.t&&x.w&&x.k, "veiksmas be teksto, kodėl arba kas"); });
  });

  /* ---------------- NEKINTAMOS TAISYKLĖS ---------------- */
  gr("Indeksavimo nekintamos taisyklės (VPT metodika)");
  t("Modelis nurodo tik kandidatus - jokių svorių", ()=>{
    Object.keys(R.INDEKSAI).forEach(k=>{
      const m=R.INDEKSAI[k];
      tiesa(Array.isArray(m.kand), k+": nėra kandidatų sąrašo");
      tiesa(!("svoriai" in m) && !("weights" in m), k+": modelyje atsirado svoriai");
      m.kand.forEach(id=> tiesa(typeof id==="string", k+": kandidatas turi būti rodiklio ID"));
    });
  }, "svorius lemia konkretaus pirkimo sąnaudų struktūra; juos pateikia tiekėjai pasiūlymo formoje");
  t("VMDU nesiūlomas kartu su SSKI (dvigubas darbo sąnaudų skaičiavimas)", ()=>{
    Object.keys(R.INDEKSAI).forEach(k=>{
      const kand=R.INDEKSAI[k].kand;
      const turiSski=kand.some(id=>id.indexOf("sski")===0);
      tiesa(!(turiSski && kand.indexOf("vmdu")>=0),
        k+": VMDU kartu su SSKI - darbo užmokestis jau yra SSKI dedamoji (VPT 53.2 p.)");
    });
  });
  t("Kiekvienas kandidatas egzistuoja kaip rodiklis", ()=>{
    Object.keys(R.INDEKSAI).forEach(k=>{
      R.INDEKSAI[k].kand.forEach(id=> tiesa(!!R.rod(id), k+": nėra rodiklio "+id));
    });
  });
  t("Kiekvienas profilis turi indeksavimo modelį", ()=>{
    R.PROFILIAI.forEach(p=> tiesa(!!R.INDEKSAI[p.indeksavimas], p.id+": nėra modelio"));
  });
  t("Ketvirtiniai rodikliai pažymėti kaip ketvirtiniai", ()=>{
    ["pki","vmdu"].forEach(id=>{
      const m=R.rod(id);
      lygu(m.osp.daznis, "ketvirtinis", id+" turi būti ketvirtinis");
    });
  }, "VMDU dydis mėnesinis, bet skelbiamas ketvirčiais - lyginama su tuo pačiu praėjusių metų ketvirčiu");

  /* ---------------- SDMX ---------------- */
  gr("OSP SDMX atsakymo skaitymas");
  t("Iš atsakymo ištraukiama tik nurodyta serija, surikiuota pagal laikotarpį", ()=>{
    const d={ structure:{ dimensions:{ observation:[
        { id:"CcM2020415", values:[{name:"Visi statiniai"},{name:"Inžineriniai statiniai"}] },
        { id:"LAIKOTARPIS", values:[{id:"2026M01"},{id:"2026M02"}] } ]}},
      dataSets:[{ observations:{ "0:0":[100], "0:1":[101], "1:1":[131], "1:0":[130] } }] };
    lygu(R.istraukSerija(d,{CcM2020415:"Inžineriniai statiniai"}),
         [{p:"2026M01",v:130},{p:"2026M02",v:131}]);
  });
  t("Netinkamos reikšmės praleidžiamos, netinkamas pjūvis negrąžinamas", ()=>{
    const d={ structure:{ dimensions:{ observation:[
        { id:"X", values:[{name:"A"},{name:"B"}] },
        { id:"LAIKOTARPIS", values:[{id:"2026M01"}] } ]}},
      dataSets:[{ observations:{ "0:0":[null], "1:0":[5] } }] };
    lygu(R.istraukSerija(d,{X:"A"}), []);
    lygu(R.istraukSerija(d,{X:"B"}), [{p:"2026M01",v:5}]);
  });


  gr("Rankinis reikšmių įvedimas");
  function svarusRod(id){ const m=R.rod(id); return {id, obs:m.obs, demo:m.demo, tikrinta:m.tikrinta, saltinisUrl:m.saltinisUrl, tikrintojas:m.tikrintojas}; }
  function grazink(sn){ const m=R.rod(sn.id); m.obs=sn.obs; m.demo=sn.demo; m.tikrinta=sn.tikrinta; m.saltinisUrl=sn.saltinisUrl; m.tikrintojas=sn.tikrintojas; }
  function ivesk(id, p, v, src, kas){
    W.rodykForma(id);
    const D=W.document;
    if(p!==undefined) D.getElementById("iv-p-"+id).value=p;
    if(v!==undefined) D.getElementById("iv-v-"+id).value=v;
    D.getElementById("iv-s-"+id).value = src===undefined ? "https://www.lme.com/" : src;
    D.getElementById("iv-t-"+id).value = kas===undefined ? "A. Testuotojas" : kas;
    W.irasykReiksme(id);
    const e=D.getElementById("iv-e-"+id);
    return e && !e.hidden ? e.textContent : null;   // grąžina klaidą arba null
  }
  t("Be šaltinio nuorodos reikšmė NEįrašoma", ()=>{
    const sn=svarusRod("lme_cu");
    try{
      const kl=ivesk("lme_cu","2026-09-01","9800","","A. Testuotojas");
      tiesa(!!kl, "turėjo būti klaida");
      tiesa(R.rod("lme_cu").demo===true, "rodiklis neturi tapti patikrintu");
    } finally { grazink(sn); W.document.getElementById("iv-lme_cu").innerHTML=""; }
  }, "senajame modulyje pakakdavo paspausti „Išsaugoti“, kad duomenys atrodytų patikrinti");
  t("Be tikrintojo reikšmė NEįrašoma", ()=>{
    const sn=svarusRod("lme_cu");
    try{
      const kl=ivesk("lme_cu","2026-09-01","9800","https://www.lme.com/","");
      tiesa(!!kl, "turėjo būti klaida"); tiesa(R.rod("lme_cu").demo===true);
    } finally { grazink(sn); W.document.getElementById("iv-lme_cu").innerHTML=""; }
  });
  t("Ne skaičius atmetamas", ()=>{
    const sn=svarusRod("lme_cu");
    try{
      const kl=ivesk("lme_cu","2026-09-01","apie devyni tūkstančiai");
      tiesa(!!kl, "turėjo būti klaida"); tiesa(R.rod("lme_cu").demo===true);
    } finally { grazink(sn); W.document.getElementById("iv-lme_cu").innerHTML=""; }
  });
  t("Pilnai užpildyta reikšmė įrašoma, rodiklis tampa patikrintu", ()=>{
    const sn=svarusRod("lme_cu");
    try{
      const kl=ivesk("lme_cu","2026-08-01","9500");
      lygu(kl, null, "klaidos neturėjo būti");
      const m=R.rod("lme_cu");
      lygu(m.demo, false); lygu(m.obs[m.obs.length-1], {p:"2026-08-01", v:9500});
      lygu(m.tikrintojas, "A. Testuotojas");
      tiesa(!!m.tikrinta, "turi būti įrašyta tikrinimo data");
    } finally { grazink(sn); W.document.getElementById("iv-lme_cu").innerHTML=""; }
  });
  t("Dvi reikšmės duoda pokytį; kablelis priimamas kaip skirtukas", ()=>{
    const sn=svarusRod("brent");
    try{
      ivesk("brent","2026-07-01","80,0");
      ivesk("brent","2026-08-01","88,0");
      const m=R.rod("brent");
      m.langas=1;
      lygu(m.obs.length, 2);
      lygu(Math.round(R.pokytis(m)), 10);
    } finally { grazink(sn); W.document.getElementById("iv-brent").innerHTML=""; }
  });
  t("Tas pats laikotarpis pakeičiamas, ne dubliuojamas; eilutė lieka surikiuota", ()=>{
    const sn=svarusRod("brent");
    try{
      ivesk("brent","2026-08-01","80");
      ivesk("brent","2026-07-01","70");
      ivesk("brent","2026-08-01","85");
      const m=R.rod("brent");
      lygu(m.obs, [{p:"2026-07-01",v:70},{p:"2026-08-01",v:85}]);
    } finally { grazink(sn); W.document.getElementById("iv-brent").innerHTML=""; }
  });
  t("Pašalinus paskutinę reikšmę rodiklis grįžta į „nepatikrintą“", ()=>{
    const sn=svarusRod("lme_al");
    try{
      ivesk("lme_al","2026-08-01","2600");
      lygu(R.rod("lme_al").demo, false);
      W.trinkStebejima("lme_al","2026-08-01");
      lygu(R.rod("lme_al").demo, true, "be duomenų rodiklis negali likti patikrintas");
      lygu(R.busena(R.rod("lme_al")), "unk");
    } finally { grazink(sn); }
  });

  gr("Duomenų senumas ir palyginimo langas");
  t("Pasenusi reikšmė pažymima atskirai, bet rinkos būsenos nekeičia", ()=>{
    const m=R.rod("lme_cu"); const sn=svarusRod("lme_cu");
    try{
      m.demo=false; m.langas=1;
      m.obs=[{p:"2026-01-01",v:100},{p:"2026-02-01",v:101}];
      m.tikrinta="2020-01-01";
      tiesa(R.pasene(m), "sena data turi būti pažymėta");
      lygu(R.busena(m), "ok", "senumas neturi keisti rinkos vertinimo");
    } finally { grazink(sn); }
  }, "auditas prašė atskirti duomenų amžių nuo rinkos rizikos");
  t("Šviežia reikšmė nelaikoma pasenusia", ()=>{
    const m=R.rod("lme_cu"); const sn=svarusRod("lme_cu");
    try{ m.demo=false; m.tikrinta=new Date().toISOString().slice(0,10); tiesa(!R.pasene(m)); }
    finally { grazink(sn); }
  });
  t("Rankiniam rodikliui rodomas TIKRAS bazinis laikotarpis, ne fiksuota etiketė", ()=>{
    const m=R.rod("brent"); const sn=svarusRod("brent");
    try{
      m.obs=[{p:"2026-01-01",v:70},{p:"2026-06-01",v:80}]; m.langas=1; m.demo=false;
