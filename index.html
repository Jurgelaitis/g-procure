<style>
  :root {
    /* EPSO-G brand spalvos ir --font-base iškelti į shared/epso-g.css (GP dizaino žetonai). */

    --radius-xl: 20px;

    --space-7: 96px;


    --shadow-card: 0 1px 2px rgba(46, 54, 65, 0.04);
    --shadow-card-hover: 0 12px 32px rgba(46, 54, 65, 0.08);
    --transition-med: 240ms ease;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    font-family: var(--font-base);
    font-size: 16px;
    line-height: 1.55;
    color: var(--color-graphite);
    background-color: var(--color-white);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    min-height: 100vh;
    background-image:
      radial-gradient(1100px 600px at 90% -200px, rgba(22, 196, 146, 0.07), transparent 60%),
      radial-gradient(900px 500px at -10% 0%, rgba(0, 165, 196, 0.05), transparent 55%);
    background-attachment: fixed;
  }

  a { color: inherit; text-decoration: none; }

  .container {
    width: 100%;
    max-width: var(--container-max);
    margin: 0 auto;
    padding: 0 var(--space-3);
  }

  /* Anchor offset below the sticky header */
  #irankiai, #suppliers { scroll-margin-top: 88px; }

  /* ────────────────  SKIP LINK  ──────────────── */
  .skip-link {
    position: absolute;
    left: -9999px;
    top: 0;
    z-index: 100;
    background: var(--color-emerald);
    color: var(--color-white);
    font-weight: 700;
    font-size: 14px;
    padding: 10px 16px;
    border-radius: 0 0 var(--radius-sm) 0;
  }
  .skip-link:focus { left: 0; }

  /* ────────────────  HEADER  ──────────────── */
  .site-header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: saturate(140%) blur(10px);
    -webkit-backdrop-filter: saturate(140%) blur(10px);
    border-bottom: 1px solid var(--color-graphite-15);
  }

  .site-header__inner {
    height: 72px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-3);
  }

  .brand { display: flex; align-items: center; gap: var(--space-2); }

  .brand__logo { height: 28px; width: auto; flex-shrink: 0; }

  .brand__divider { width: 1px; height: 26px; background: var(--color-graphite-15); }

  .brand__product { display: flex; flex-direction: column; line-height: 1.1; }

  .brand__product-name {
    font-size: 17px;
    font-weight: 800;
    letter-spacing: -0.01em;
    color: var(--color-graphite);
  }
  .brand__product-name em { color: var(--color-emerald); font-style: normal; }

  .brand__product-tag {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--color-graphite-50);
    margin-top: 2px;
  }

  .site-header__actions { display: flex; align-items: center; gap: var(--space-2); }
  .site-nav { display: flex; align-items: center; gap: var(--space-2); }
  .nav-link[aria-current] { color: var(--color-emerald); }

  /* „Tiekėjams" - vienintelis veiksmo mygtukas antraštėje: veda TIESIAI į įrankį, ne į
     puslapio sekciją. Fonas grafitas, ne smaragdas: 14 px pusjuodis tekstas nėra „didelis"
     WCAG prasme, tad reikia 4,5:1, o ant smaragdo balta duoda 3,35:1, grafitas 3,65:1 -
     nė vienas esamas žetonas ant smaragdo nepraeina. Grafitas su balta = 12,21:1. */
  .nav-cta {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 38px;
    padding: 0 18px;
    border-radius: 999px;
    background: var(--color-graphite);
    color: var(--color-white);
    font-size: 14px;
    font-weight: 800;
    white-space: nowrap;
    transition: background var(--transition-fast);
  }
  .nav-cta:hover { background: var(--color-emerald-120); color: var(--color-white); }
  .nav-cta:focus-visible { outline: 2px solid var(--color-emerald); outline-offset: 2px; }

  /* Meniu mygtukas ir kūrėjo nuoroda - tik siaurame ekrane */
  .nav-toggle { display: none; }
  .nav-link--creator { display: none; }

  .nav-link {
    font-size: 14px;
    font-weight: 600;
    color: var(--color-graphite-50);
    transition: color var(--transition-fast);
    white-space: nowrap;
  }
  .nav-link:hover { color: var(--color-emerald); }
  .nav-link:focus-visible { outline: 2px solid var(--color-emerald); outline-offset: 2px; border-radius: 4px; }

  .lang-switch {
    display: inline-flex;
    border: 1px solid var(--color-graphite-15);
    border-radius: 999px;
    padding: 3px;
    background: var(--color-white);
  }
  .lang-switch__btn {
    border: 0;
    background: transparent;
    font-family: var(--font-base);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--color-graphite-50);
    padding: 5px 12px;
    border-radius: 999px;
    cursor: pointer;
    transition: background var(--transition-fast), color var(--transition-fast);
  }
  .lang-switch__btn:hover { color: var(--color-graphite); }
  /* Aktyvi kalba: šviesiai žalias fonas su grafito tekstu = 11,33:1. Anksčiau buvo balta
     ant smaragdo - tik 3,35:1, o 12 px tekstui reikia 4,5:1. Smaragdo atspalviai čia
     netinka iš principo: emerald-120 ant green-5 duoda 3,96:1, ant balto 4,27:1. */
  .lang-switch__btn[aria-pressed="true"] { background: var(--color-green-5); color: var(--color-graphite); box-shadow: inset 0 0 0 1px var(--color-green-15); }
  .lang-switch__btn:focus-visible { outline: 2px solid var(--color-emerald); outline-offset: 2px; }

  /* ────────────────  HERO  ──────────────── */
  .hero { padding: var(--space-7) 0 var(--space-6); position: relative; }

  .hero__eyebrow {
    display: inline-flex;
    align-items: center;
    gap: var(--space-1);
    padding: 6px 12px;
    background: var(--color-green-5);
    color: var(--color-emerald-120);
    border: 1px solid var(--color-green-15);
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: var(--space-3);
  }

  .hero__title {
    font-size: clamp(40px, 6vw, 64px);
    font-weight: 800;
    letter-spacing: -0.025em;
    color: var(--color-graphite);
    line-height: 1.05;
    margin-bottom: var(--space-3);
  }
  .hero__title em { color: var(--color-emerald); font-style: normal; }

  .hero__lead {
    font-size: clamp(17px, 1.6vw, 19px);
    color: var(--color-graphite-50);
    max-width: 720px;
    line-height: 1.6;
  }

  /* ────────────────  SECTIONS  ──────────────── */
  .section { padding: var(--space-5) 0 var(--space-6); }

  .section__head {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: var(--space-3);
    margin-bottom: var(--space-4);
    flex-wrap: wrap;
  }
  .section__title {
    font-size: 24px;
    font-weight: 800;
    color: var(--color-graphite);
    letter-spacing: -0.015em;
  }
  .section__hint { font-size: 13px; color: var(--color-graphite-50); }

  /* Vaidmens ženklinimas virš katalogo: kam skirta ši dalis (organizatoriams).
     Tekstas grafitas-50 ant balto = 4,61:1; smaragdo brūkšnys dekoratyvus. */
  .section__eyebrow {
    display: inline-flex;
    align-items: center;
    gap: var(--space-1);
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--color-graphite-50);
    margin-bottom: var(--space-1);
  }
  .section__eyebrow::before { content: ""; width: 28px; height: 2px; background: var(--color-emerald); border-radius: 1px; }
  .section__sub { font-size: 15px; color: var(--color-graphite-50); margin-top: 6px; }

  /* ────────────────  SLENKSTIS  ────────────────
     Ne tarpas, o riba tarp dviejų pirkimo pusių: plona linija su užrašu per vidurį. */
  .threshold { padding: 0 0 var(--space-4); }
  .threshold__inner {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: var(--space-3);
  }
  .threshold__line { height: 1px; background: var(--color-graphite-30); }
  .threshold__label { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; }
  .threshold__title { font-size: 15px; font-weight: 800; color: var(--color-graphite); letter-spacing: -0.005em; }
  .threshold__meta { font-size: 12px; font-weight: 600; color: var(--color-graphite-50); letter-spacing: 0.02em; }

  /* ────────────────  KAS DALYVAUJA PIRKIMUOSE  ────────────────
     Kontrastinga juosta per visą plotį - kita pirkimo pusė turi kitą vizualinę kalbą,
     kad tiekėjų įėjimas neatrodytų kaip 13-as modulis. Fonas - tas pats prekės ženklo
     gradientas (--gradient-dark, shared/epso-g.css), kurį naudoja modulių antraštės, tarp
     jų ir PP-tiekejams: paspaudęs mygtuką tiekėjas patenka į įrankį su tokia pat antrašte.
     Balta ant gradiento taškų 12,44 / 9,07 / 6,57:1
     (gairės: ant tamsaus gradiento - baltas tekstas, Smaragdas-50 akcentai). */
  .participants { color: var(--color-white); padding: var(--space-5) 0 var(--space-6); }
  .participants--green { background: var(--gradient-dark); }

  .participants__head { margin-bottom: var(--space-3); }
  .participants__eyebrow {
    display: inline-flex;
    align-items: center;
    gap: var(--space-1);
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--color-white);
    margin-bottom: var(--space-1);
  }
  .participants__eyebrow::before { content: ""; width: 28px; height: 2px; background: var(--color-emerald-50); border-radius: 1px; }
  .participants__sub { font-size: 18px; font-weight: 600; color: var(--color-white); max-width: 720px; }

  /* Viena plati šviesi panelė ant tamsaus fono: viena antraštės eilutė (ikona, ženkliukas,
     pavadinimas), po ja žingsniai per visą plotį. Akcentas - --color-blue: balta ant mėlyno
     6,57:1, mėlyna ant balto 6,57:1. Šešėlis - gairių --shadow-subtle. */
  .panel {
    background: var(--color-white);
    color: var(--color-graphite);
    border-radius: var(--radius-xl);
    padding: var(--space-4);
    box-shadow: var(--shadow-subtle);
  }
  .panel__icon {
    width: 48px;
    height: 48px;
    display: grid;
    place-items: center;
    border-radius: var(--radius-md);
    background: var(--color-cyan-5);
    color: var(--color-blue);
    flex-shrink: 0;
  }
  .panel__icon svg { width: 24px; height: 24px; stroke: currentColor; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .panel__top { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; margin-bottom: var(--space-3); }
  .panel__badge {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 999px;
    background: var(--color-blue);
    color: var(--color-white);
    white-space: nowrap;
  }
  .panel__title { font-size: 24px; font-weight: 800; letter-spacing: -0.015em; color: var(--color-graphite); }

  .steps {
    list-style: none;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: var(--space-3);
    margin-bottom: var(--space-3);
  }
  .step { position: relative; display: flex; align-items: flex-start; gap: 12px; padding-right: var(--space-3); }
  .step__num {
    width: 32px;
    height: 32px;
    flex-shrink: 0;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: var(--color-blue);
    color: var(--color-white);
    font-size: 14px;
    font-weight: 800;
  }
  .step__text { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .step__title { font-size: 16px; font-weight: 800; color: var(--color-graphite); line-height: 1.3; }
  .step__desc { font-size: 13px; color: var(--color-graphite-50); line-height: 1.45; }
  /* Rodyklė tarp žingsnių (dekoratyvi): tik plačiame makete, tarpo viduryje.
     „/ ""“ - tuščias alternatyvus tekstas, kad ekrano skaitytuvai neskaitytų „rodyklė dešinėn“;
     senesnės naršyklės ima pirmą (paprastą) deklaraciją. */
  .step:not(:last-child)::after {
    content: "→";
    content: "→" / "";
    position: absolute;
    right: -6px;
    top: 2px;
    font-size: 20px;
    line-height: 1;
    color: var(--color-graphite-50);
  }

  .panel__foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-3);
    padding-top: var(--space-3);
    border-top: 1px solid var(--color-graphite-15);
  }
  .panel__note { font-size: 13px; color: var(--color-graphite-50); line-height: 1.5; max-width: 640px; }
  /* Primary mygtukas pagal gaires: Smaragdas + baltas tekstas, hover Smaragdas-120.
     Balta ant smaragdo = 3,35:1, todėl tekstas laikomas DIDELIU (>= 14 pt bold, čia 19 px/800):
     WCAG AA dideliam tekstui reikalauja >= 3:1. Fokuso žiedas grafitas, ne gairių smaragdas:
     smaragdinis žiedas ant smaragdinio mygtuko būtų nematomas (grafitas ant balto 12,2:1,
     ant mygtuko 3,65:1). */
  .panel__cta {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
    padding: 12px 24px;
    border-radius: 999px;
    background: var(--color-emerald);
    color: var(--color-white);
    font-size: 19px;
    font-weight: 800;
    letter-spacing: -0.005em;
    white-space: nowrap;
    transition: background var(--transition-fast);
  }
  .panel__cta::after { content: "→"; content: "→" / ""; font-size: 20px; line-height: 1; }
  .panel__cta:hover { background: var(--color-emerald-120); }
  .panel__cta:focus-visible { outline: 2px solid var(--color-graphite); outline-offset: 3px; }

  /* Juosta yra paskutinė <main> sekcija: poraštės viršutinė paraštė čia virstų baltu tarpu
     tarp tamsios juostos ir poraštės linijos - poraštė prasideda iš karto po juostos. */
  main + .footer { margin-top: 0; }

  /* ────────────────  PROJECT GRID  ──────────────── */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: var(--space-3);
  }

  .card {
    position: relative;
    display: flex;
    flex-direction: column;
    background: var(--color-white);
    border: 1px solid var(--color-graphite-15);
    border-radius: var(--radius-lg);
    padding: var(--space-3);
    box-shadow: var(--shadow-card);
    transition: border-color var(--transition-fast),
                box-shadow var(--transition-med),
                transform var(--transition-med);
    overflow: hidden;
    isolation: isolate;
  }
  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, var(--color-green-5) 0%, transparent 70%);
    opacity: 0;
    transition: opacity var(--transition-med);
    z-index: -1;
  }
  .card:hover {
    border-color: var(--color-emerald-50);
    box-shadow: var(--shadow-card-hover);
    transform: translateY(-2px);
  }
  .card:hover::before { opacity: 1; }
  .card:focus-within { outline: 2px solid var(--color-emerald); outline-offset: 2px; }

  .card__top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: var(--space-2);
    margin-bottom: var(--space-3);
  }

  .card__icon {
    width: 48px;
    height: 48px;
    display: grid;
    place-items: center;
    border-radius: var(--radius-md);
    background: var(--color-green-5);
    border: 1px solid var(--color-green-15);
    color: var(--color-emerald);
    transition: background var(--transition-fast), color var(--transition-fast);
    flex-shrink: 0;
  }
  .card:hover .card__icon { background: var(--color-emerald); color: var(--color-white); }
  .card__icon svg {
    width: 24px; height: 24px;
    stroke: currentColor; stroke-width: 1.5; fill: none;

<script>
(function () {
  var STORAGE_KEY = "gprocure-lang";

  /* Pradinė kalba - bendra taisyklė visai svetainei (shared/lang-detect.js):
     rankinis pasirinkimas -> lankytojas iš Lietuvos = LT, kiti = EN. Logika gyvena
     viename faile, nes ją dalijasi visi trys portalo puslapiai ir moduliai; raktas
     tas pats, tad kalba nešokinėja pereinant tarp puslapių. Jei bendras failas
     neįsikeltų, gerbiamas bent anksčiau įsimintas pasirinkimas. */
  function detectLang() {
    if (window.GP_LANG) return GP_LANG.detect(STORAGE_KEY);
    try { return localStorage.getItem(STORAGE_KEY) === "en" ? "en" : "lt"; } catch (e) { return "lt"; }
  }

  function applyLang(lang) {
    document.documentElement.setAttribute("lang", lang);

    var nodes = document.querySelectorAll("[data-lt]");
    for (var i = 0; i < nodes.length; i++) {
      var value = nodes[i].getAttribute("data-" + lang);
      if (value !== null) nodes[i].innerHTML = value;
    }

    var ariaNodes = document.querySelectorAll("[data-lt-aria]");
    for (var j = 0; j < ariaNodes.length; j++) {
      var ariaValue = ariaNodes[j].getAttribute("data-" + lang + "-aria");
      if (ariaValue !== null) ariaNodes[j].setAttribute("aria-label", ariaValue);
    }

    var buttons = document.querySelectorAll(".lang-switch__btn");
    for (var k = 0; k < buttons.length; k++) {
      buttons[k].setAttribute(
        "aria-pressed",
        buttons[k].getAttribute("data-lang") === lang ? "true" : "false"
      );
    }
  }

  applyLang(detectLang());

  document.addEventListener("click", function (event) {
    var btn = event.target.closest ? event.target.closest(".lang-switch__btn") : null;
    if (!btn) return;
    var lang = btn.getAttribute("data-lang");
    if (window.GP_LANG) GP_LANG.remember(STORAGE_KEY, lang);
    applyLang(lang);
  });

  // ── Išskleidžiamas meniu siaurame ekrane ──
  var toggle = document.getElementById("navToggle");
  var nav = document.getElementById("mainNav");
  function uzdarykMeniu() { nav.removeAttribute("data-open"); toggle.setAttribute("aria-expanded", "false"); }
  if (toggle && nav) {
    toggle.addEventListener("click", function () {
      if (nav.getAttribute("data-open") === "true") { uzdarykMeniu(); }
      else { nav.setAttribute("data-open", "true"); toggle.setAttribute("aria-expanded", "true"); }
    });
    nav.addEventListener("click", function (e) { if (e.target.closest && e.target.closest("a")) uzdarykMeniu(); });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape") uzdarykMeniu(); });
    window.addEventListener("resize", function () { if (window.innerWidth >= 768) uzdarykMeniu(); });
  }

  // ── Aktyvi sekcija navigacijoje (aria-current="location") ──
  // Du nepriklausomi keliai, kad žyma neliktų vien nuo stebėtojo malonės:
  // 1) adreso fragmentas (paspaudus nuorodą arba atėjus tiesiogine nuoroda),
  // 2) slinkimas - IntersectionObserver, kai naršyklė jį palaiko.
  var irankiaiSek = document.getElementById("irankiai");
  var irankiaiLink = nav && nav.querySelector('a[href="#irankiai"]');
  function zymekIrankius(aktyvu) {
    if (!irankiaiLink) return;
    if (aktyvu) irankiaiLink.setAttribute("aria-current", "location");
    else irankiaiLink.removeAttribute("aria-current");
  }
  function pagalFragmenta() { if (location.hash === "#irankiai") zymekIrankius(true); }
  pagalFragmenta();
  window.addEventListener("hashchange", pagalFragmenta);
  if (irankiaiLink) irankiaiLink.addEventListener("click", function () { zymekIrankius(true); });
  if (irankiaiSek && irankiaiLink && "IntersectionObserver" in window) {
    new IntersectionObserver(function (entries) {
      for (var i = 0; i < entries.length; i++) zymekIrankius(entries[i].isIntersecting);
    }, { rootMargin: "-88px 0px -60% 0px" }).observe(irankiaiSek);
  }

  // ── Reveal on scroll ──
  var revealEls = document.querySelectorAll(".reveal");
  if ("IntersectionObserver" in window) {
    var io = new IntersectionObserver(function (entries) {
      for (var i = 0; i < entries.length; i++) {
        if (entries[i].isIntersecting) {
          entries[i].target.classList.add("is-visible");
          io.unobserve(entries[i].target);
        }
      }
    }, { rootMargin: "0px 0px -8% 0px", threshold: 0.05 });
    for (var r = 0; r < revealEls.length; r++) io.observe(revealEls[r]);
  } else {
    for (var f = 0; f < revealEls.length; f++) revealEls[f].classList.add("is-visible");
  }
})();
</script>
