<script>
(function () {
  /* Kalba - kaip portalo ir pirkimų kortelių (raktas „gprocure-lang“); statiniai tekstai - data-lt / data-en, darbo stalas perpiešia
     pats pagal <html lang>. */
  var L = window.GP_LANG ? GP_LANG.detect("gprocure-lang") : "lt";
  var TITULAS = { lt: "Mano pirkimai · G-Procure", en: "My procurements · G-Procure" };
  function pritaikyk() {
    document.documentElement.lang = L;
    document.title = TITULAS[L];
    [].forEach.call(document.querySelectorAll("[data-lt]"), function (e) { e.textContent = e.getAttribute("data-" + L); });
    [].forEach.call(document.querySelectorAll("[data-lt-aria]"), function (e) { e.setAttribute("aria-label", e.getAttribute("data-" + L + "-aria")); });
    [].forEach.call(document.querySelectorAll("#kalbos button"), function (b) {
      var on = b.getAttribute("data-lang") === L;
      b.classList.toggle("active", on); b.setAttribute("aria-pressed", on ? "true" : "false");
    });
    if (window.GProcureInfoPanel && GProcureInfoPanel.refresh) GProcureInfoPanel.refresh();
  }
  [].forEach.call(document.querySelectorAll("#kalbos button"), function (b) {
    b.addEventListener("click", function () {
      var l = b.getAttribute("data-lang");
      if (l === L || !/^(lt|en)$/.test(l)) return;
      L = l;
      if (window.GP_LANG) GP_LANG.remember("gprocure-lang", l);
      pritaikyk();
    });
  });
  if (L !== "lt") pritaikyk();
  if (window.GP_MANO_PIRKIMAI) {
    GP_MANO_PIRKIMAI.mount({ target: "#stalas", saknis: "", rezimas: "stalas",
      getLang: function () { return document.documentElement.getAttribute("lang") === "en" ? "en" : "lt"; } });
  }
  if (window.GProcureInfoPanel && document.getElementById("infoPanelMount")) {
    GProcureInfoPanel.mount({ target: "#infoPanelMount", moduleId: "mano-pirkimai",
      getLang: function () { return document.documentElement.getAttribute("lang") === "en" ? "en" : "lt"; },
      content: { lt: {
        title: "Kas tai ir kaip naudotis",
        purpose: "Darbo stalas - visi šios naršyklės pirkimai vienoje vietoje: kas artėja, ką reikia papildyti ar peržiūrėti ir kurį įrankį atverti toliau. Duomenys imami iš pirkimų kortelių; įrankiai atsidaro jau su pasirinktu pirkimu.",
        stepsTitle: "Kaip naudotis",
        steps: [
          "<b>Rodikliai viršuje</b> - ir filtrai: paspaudus „Terminai per 5 d. d.“ ar „Reikia dėmesio“, rodomi tik tie pirkimai; antras paspaudimas grąžina visus.",
          "<b>Terminų laiko juosta</b> rodo praėjusią savaitę ir septynias į priekį, viršuje - kiek terminų tenka kiekvienai savaitei: pirkimo pradžią, paskelbimą, pasiūlymų terminą, sutarties sudarymą ir pirkimo grafiko etapus (jei grafikas įrašytas į kortelę). Paspaudus pirkimo pavadinimą - jo eilutė sąraše.",
          "<b>Sąrašas</b> grupuojamas pagal artimiausią terminą arba pagal etapą; eilutėje - kitas žingsnis ir įrankiai. Smeigtuku pažymėtas pirkimas portale rodomas pirmas.",
          "<b>„Terminai į kalendorių (.ics)“</b> - visų šiandienos ir vėlesnių kortelių datų failas kalendoriaus programai (pvz., Outlook), prieš pasiūlymų terminą - priminimas dieną anksčiau. <b>„Savaitės planas (Word)“</b> - šios ir kitos savaitės terminai, kas reikalauja dėmesio, ir kiti aktyvūs pirkimai.",
          "<b>„Patikrinti CVP IS duomenis“</b> palygina kortelių terminus ir būsenas su viešais CVP IS duomenimis. Kortelės nekeičiamos."
        ],
        noteTitle: "Kur saugoma",
        note: "Kortelės saugomos <b>tik šioje naršyklėje</b>; darbo stalas ten pat įsimena tik prisegtų pirkimų sąrašą. Kalendoriaus failas ir savaitės planas sudaromi naršyklėje ir niekur nesiunčiami. „Reikia dėmesio“ - tik iš kortelės duomenų: trūksta vertės, būdo, vykdytojo, įstatymo ar būsenos, paskelbto pirkimo terminas praėjo, įrankio rezultatas sudarytas pagal ankstesnius kortelės duomenis arba (po patikros) kortelė skiriasi nuo CVP IS. Paspaudus „Patikrinti CVP IS duomenis“ į G-Procure serverį siunčiami tik kortelių CVP IS numeriai."
      }, en: {
        title: "What it is and how to use it",
        purpose: "The desk shows all procurements in this browser in one place: what is coming up, what needs completing or reviewing, and which tool to open next. The data come from the procurement cards; the tools open with the procurement already selected.",
        stepsTitle: "How to use it",
        steps: [
          "<b>The figures at the top</b> are also filters: press “Deadlines within 5 working days” or “Need attention” to see only those procurements; press again to see all.",
          "<b>The timeline</b> covers last week and seven weeks ahead: procurement start, publication, tender deadline, contract signing and the procurement schedule stages (if the schedule is saved on the card), with the number of dates in each week at the top. Press a procurement title to go to its row in the list.",
          "<b>The list</b> is grouped by the nearest date or by stage; each row shows the next step and the tools. A procurement marked with the pin is shown first in the portal.",
          "<b>“Dates to calendar (.ics)”</b> - a file with all card dates from today onwards for a calendar app (e.g. Outlook), with a reminder one day before each tender deadline. <b>“Weekly plan (Word)”</b> - this and next week's dates, what needs attention and the other active procurements.",
          "<b>“Check CVP IS data”</b> compares the card dates and statuses with the public CVP IS data. The cards are not changed."
        ],
        noteTitle: "Where it is stored",
        note: "The cards are stored <b>only in this browser</b>; the desk only remembers the list of pinned procurements there. The calendar file and the weekly plan are made in the browser and not sent anywhere. “Need attention” is based only on the card data: the value, procedure, contracting body, law or status is missing, the tender deadline of a published procurement has passed, a tool result was made with earlier card data, or (after the check) the card differs from CVP IS. When you press “Check CVP IS data”, only the CVP IS numbers of the cards are sent to the G-Procure server."
      } } });
  }
})();
</script>
