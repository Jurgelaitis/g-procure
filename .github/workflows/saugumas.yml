# G-Procure saugumo patikra pagal tvarkaraštį (2026-11-24, saugumo auditas G-17): spragos bibliotekose atsiranda ir be mūsų pakeitimų,
# todėl OSV patikra (.github/testai/saugumas.py - bibliotekų spragos, paslaptys, security.txt, SBOM) - kas dieną, o ne tik po push'o.
# Pirmadieniais (ir paleidus ranka) - ir bibliotekų kilmė: oficialūs paketai atsisiunčiami, jų maiša sutikrinama su npm registru, o
# kiekvienas svetainės failas - baitas į baitą su failu pakete (.github/testai/sbom.py --kilme). Nepavykus GitHub atsiunčia laišką.
name: Saugumo patikra

on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: saugumas
  cancel-in-progress: false

jobs:
  tikrinti:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
        with:
          persist-credentials: false
      - name: Bibliotekų spragos (OSV), paslaptys, security.txt, SBOM
        run: python3 -I .github/testai/saugumas.py
      - name: Bibliotekų kilmė (pirmadieniais ir paleidus ranka)
        if: always()
        run: |
          if [ "$(date -u +%u)" = "1" ] || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            python3 -I .github/testai/sbom.py --kilme
          else
            echo "Kilmė tikrinama pirmadieniais."
          fi
