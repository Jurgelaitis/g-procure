# G-Procure stebėsena (2026-11-23, naudotojo sprendimas po saugumo audito): kas valandą tikrina svetainę, DI serverį, DI dienos ribą,
# CVP IS duomenų šviežumą, sankcijų sąrašus, viešų sutarčių paslaugą, API saugumo antraštes ir DI serverio teisės nuorodų kopijas
# (.github/stebesena/tikrink.py - tik GET, tik standartinė biblioteka).
# Nepavykus GitHub atsiunčia laišką tam, kas paskutinis keitė šio failo tvarkaraštį. Kas valandą, ne dažniau - kiekviena nepavykusi
# patikra siunčia laišką. GitHub sustabdo suplanuotas eigas, jei saugykloje 60 dienų nebuvo pakeitimų - tada įjungti iš naujo (Actions).
name: Stebėsena

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stebesena
  cancel-in-progress: false

jobs:
  tikrinti:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
        with:
          # Istorija be failų turinio (tik commit'ai ir medžiai): tikrink.py iš jos sužino, kada pakeistas DI instrukcijų šaltinis (2026-11-25)
          fetch-depth: 0
          filter: blob:none
      - name: Svetainė ir serverio paslaugos
        run: python3 -I .github/stebesena/tikrink.py
