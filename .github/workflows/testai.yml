# G-Procure testai ir svetainės diegimas (R4, 2026-09-28; diegimas tik po žalių testų - saugumo auditas 2026-11-21, G-03).
# Po kiekvieno push'o į main ir pull request'o paleidžiami visi modulių testai.html tikru Chrome be ekrano
# (.github/testai/paleisk.py - tik Python standartinė biblioteka). Svetainė (GitHub Pages) diegiama TIK po to, kai testai praėjo,
# ir tik iš main šakos (ne pull request'ams). Pages šaltinis - „GitHub Actions“ (Settings - Pages - Build and deployment - Source).
# Aplinka - kaip patikrinta vietoje: Europe/Vilnius laiko juosta (datų testai), naršyklės kalba en-GB.
# Veiksmai prisegti prie konkrečių versijų (commit SHA), kad pakeista žymė negalėtų pakeisti vykdomo kodo.
name: Testai

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testai-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testai:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Europe/Vilnius
      LANG: en_GB.UTF-8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
      - name: Chrome ir Python
        run: |
          google-chrome --version
          python3 --version
      - name: Visi testai
        run: python3 .github/testai/paleisk.py

  diegimas:
    needs: testai
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.diegti.outputs.page_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b   # v5.0.0
      - name: Svetainė (Jekyll, kaip GitHub Pages)
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697   # v1.0.13
        with:
          source: ./
          destination: ./_site
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa   # v3.0.1
      - id: diegti
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e   # v4.0.5
