# G-Procure testai (R4, 2026-09-28): po kiekvieno push'o į main ir pull request'o paleidžiami visi modulių
# testai.html tikru Chrome be ekrano (.github/testai/paleisk.py - tik Python standartinė biblioteka).
# Svetainės neliečia: GitHub Pages diegiamas atskirai, šis darbas tik praneša, ar testai praėjo.
# Aplinka - kaip patikrinta vietoje: Europe/Vilnius laiko juosta (datų testai), naršyklės kalba en-GB.
name: Testai

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testai-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testai:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Europe/Vilnius
      LANG: en_GB.UTF-8
    steps:
      - uses: actions/checkout@v5
      - name: Chrome ir Python
        run: |
          google-chrome --version
          python3 --version
      - name: Visi testai
        run: python3 .github/testai/paleisk.py
