# G-Procure sankcijų sąrašų patikra - nginx nustatymai (diegimas - serveris/README.md).
#
# 1) Ribos zona - http lygmeniu: failas /etc/nginx/conf.d/gp-sankcijos-limit.conf su viena eilute
#      limit_req_zone $binary_remote_addr zone=gp_sankcijos:10m rate=30r/m;
#    (limit_req_status 429 jau nustatytas conf.d/gp-cors-limit.conf).
#
# 2) Žemiau esantis blokas - į api.g-procure.com server bloką (sites-enabled/g-procure), prieš bendrąjį location /.
#    CORS antraštes grąžina pati paslauga (tik g-procure.com ir vietiniam tikrinimui).
location /api/sankcijos/ {
    limit_except GET HEAD OPTIONS { deny all; }
    limit_req zone=gp_sankcijos burst=10 nodelay;
    # Užklausoje - tiekėjo pavadinimas: kas ir ko ieškojo - nesaugoma (limit_req atvejai lieka error.log - fail2ban juos naudoja).
    access_log off;
    client_max_body_size 1k;
    proxy_pass http://127.0.0.1:3002;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
    add_header Strict-Transport-Security "max-age=31536000" always;
}
