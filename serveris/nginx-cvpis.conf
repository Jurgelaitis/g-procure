# G-Procure CVP IS duomenų paslauga - nginx nustatymai (diegimas - serveris/README.md).
#
# 1) Ribos zona - http lygmeniu: failas /etc/nginx/conf.d/gp-cvpis-limit.conf su viena eilute
#      limit_req_zone $binary_remote_addr zone=gp_cvpis:10m rate=60r/m;
#    (limit_req_status 429 jau nustatytas conf.d/gp-cors-limit.conf - shared/ai-proxy.js kartoja tik 429).
#
# 2) Žemiau esantis blokas - į api.g-procure.com server bloką (sites-enabled/g-procure), prieš bendrąjį location /.
#    add_header šiame bloke nutraukia server lygmens add_header paveldėjimą - CORS antraštes grąžina pati paslauga
#    (tik g-procure.com ir vietiniam tikrinimui), todėl jos nesidubliuoja.
location /api/cvpis/ {
    limit_except GET HEAD OPTIONS { deny all; }
    limit_req zone=gp_cvpis burst=30 nodelay;
    # Kas ir kokio pirkimo ieškojo - nesaugoma (limit_req atvejai lieka error.log - fail2ban juos naudoja).
    access_log off;
    client_max_body_size 1k;
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
    add_header Strict-Transport-Security "max-age=31536000" always;
}
