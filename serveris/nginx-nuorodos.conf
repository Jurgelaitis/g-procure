# G-Procure trumpos kvietimų nuorodos - nginx nustatymai (diegimas - serveris/README.md).
#
# 1) Ribos zona - http lygmeniu: failas /etc/nginx/conf.d/gp-nuorodos-limit.conf su viena eilute
#      limit_req_zone $binary_remote_addr zone=gp_nuorodos:10m rate=30r/m;
#    (limit_req_status 429 jau nustatytas conf.d/gp-cors-limit.conf).
#
# 2) Žemiau esantys blokai - į api.g-procure.com server bloką (sites-enabled/g-procure), prieš bendrąjį location /.
#    CORS antraštes grąžina pati paslauga (tik g-procure.com ir vietiniam tikrinimui); kurti ir trinti - tik su G-Procure kilme.
location = /api/k {
    limit_except POST OPTIONS { deny all; }
    limit_req zone=gp_nuorodos burst=10 nodelay;
    # Kūne - kvietimų kodai (pirkimo aprašas, kontaktinis asmuo, tiekėjas): nesaugoma prieigos žurnale
    access_log off;
    client_max_body_size 200k;
    proxy_pass http://127.0.0.1:3004;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    proxy_send_timeout 15s;
    add_header Strict-Transport-Security "max-age=31536000" always;
}
location ^~ /api/k/ {
    limit_except GET HEAD POST OPTIONS { deny all; }
    limit_req zone=gp_nuorodos burst=20 nodelay;
    # Kelyje - trumpos nuorodos ID (juo pasiekiamas kvietimas): nesaugoma prieigos žurnale
    access_log off;
    client_max_body_size 8k;
    proxy_pass http://127.0.0.1:3004;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    proxy_send_timeout 15s;
    add_header Strict-Transport-Security "max-age=31536000" always;
}
