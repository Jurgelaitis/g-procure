<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; worker-src 'self' blob:; frame-src 'self'; form-action 'none'; object-src 'none'; base-uri 'self'; connect-src 'self' https://api.g-procure.com data: blob:">
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<meta name="referrer" content="no-referrer" />
<title>G-Procure kvietimas</title>
<link rel="icon" href="../favicon.ico" sizes="32x32">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<!-- Trumpa elektroninės apklausos kvietimo nuoroda (2026-11-27): https://g-procure.com/k/#<ID>. ID (po „#“) į GitHub Pages
     nesiunčiamas; k.js gauna kvietimo kodą iš G-Procure serverio ir atveria tiekėjo puslapį PP-report/pasiulymas.html. -->
<style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#EFF1F1;color:#2E3641;padding:16px;box-sizing:border-box}
main{max-width:560px;background:#fff;border-radius:12px;padding:24px;box-shadow:0 1px 3px rgba(46,54,65,.12);font-size:16px;line-height:1.5}
h1{font-size:20px;margin:0 0 8px}h1 .en{font-size:20px;font-weight:600}p{margin:0 0 8px}.en{color:#5B6470;font-size:14px}button{font:inherit;font-weight:600;margin-top:12px;min-height:40px;padding:8px 16px;border-radius:8px;border:1px solid #007554;background:#007554;color:#fff;cursor:pointer}
button[hidden]{display:none}
form[hidden]{display:none}form{margin-top:16px}label{display:block;font-size:14px;font-weight:600;margin-bottom:4px}
input{font:inherit;font-size:14px;width:100%;box-sizing:border-box;min-height:40px;padding:8px 12px;border:1px solid #9AA1A9;border-radius:8px}
input:focus-visible,button:focus-visible{outline:2px solid #007554;outline-offset:2px}.klaida{color:#B3263A;font-size:14px;margin-top:6px}</style>
</head>
<body>
<main>
  <!-- Gyva sritis: būsenos pasikeitimą („Nuoroda nebegalioja“) išgirsta ir ekrano skaitytuvas (2026-11-27, tiekėjo patikra M6) -->
  <div id="kBusena" role="status" aria-live="polite">
  <h1 id="kH"><span id="kHLt">Atveriamas kvietimas…</span><span class="en" id="kHEn" lang="en"> / Opening the invitation…</span></h1>
  <noscript><p>Šiam puslapiui reikia JavaScript - įjunkite jį naršyklėje arba atverkite nuorodą kitoje naršyklėje.</p><p class="en" lang="en">This page requires JavaScript - enable it in your browser or open the link in another browser.</p></noscript>
  <p id="kLt">Palaukite - kvietimas pateikti pasiūlymą atveriamas.</p>
  <p class="en" id="kEn" lang="en">Please wait - the request for quotation is opening.</p>
  </div>
  <button type="button" id="kKartoti" hidden>Bandyti dar kartą / Try again</button>
  <!-- Nuoroda nepilna (pvz., nuorodų tikrinimo paslauga numetė dalį po „#“) - čia galima įklijuoti nuorodą iš laiško (2026-11-27, tiekėjo patikra V5) -->
  <form id="kForma" hidden>
    <label for="kNuoroda">Įklijuokite nuorodą iš kvietimo laiško <span lang="en">/ Paste the link from the invitation email</span></label>
    <input type="text" id="kNuoroda" autocomplete="off" spellcheck="false" placeholder="pvz., https://g-procure.com/k/#7F3K9QX2MZ" aria-describedby="kFormaKl">
    <p class="klaida" id="kFormaKl" role="alert"></p>
    <button type="submit" id="kAtverti">Atverti kvietimą / Open the invitation</button>
  </form>
</main>
<script src="../PP-report/apklausa.js"></script><!-- pašto filtrų perrašytų nuorodų atstatymas (GP_APKLAUSA.nuorodosTekstas) -->
<script src="k.js"></script>
</body>
</html>
