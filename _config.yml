# GitHub Pages (Jekyll) nepublikuoja katalogų, prasidedančių tašku. .well-known/security.txt (RFC 9116) - pranešimų
# apie saugumo spragas kontaktas, todėl jis įtraukiamas atskirai. Kiti taško katalogai (.github, .claude) lieka nepublikuojami.
include:
  - .well-known
# Testų puslapiai, jų duomenys ir kūrėjų įrankiai svetainėje neskelbiami (saugumo auditas G-10, 2026-11-23): testai rašo ir trina
# naršyklės saugyklą, todėl vykdomi tik vietoje ir GitHub Actions (shared/testu-aplinka.js - jis pats skelbiamas, kad apsauga veiktų
# ir tada, jei testų puslapis kada nors vėl būtų paskelbtas). Šis sąrašas pakeičia Jekyll numatytąjį (Gemfile, node_modules,
# vendor/bundle ir kt. - šioje saugykloje jų nėra). Naujas testų ar kūrėjų failas - į šį sąrašą (sargas shared/testai.html).
exclude:
  - "*/testai.html"
  - PP-teise/testai-registras.json
  - PP-teise/testai-registras-es.json
  - PP-teise/es-saltiniai-testai.py
  - shared/testu-apsauga.js
  - shared/testu-dalys.js
  - PP-salygos/kartografas.html
  - PP-salygos/E0-variklis.html
