<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atsarginė duomenų kopija · G-Procure data backup</title>
<meta name="description" content="G-Procure duomenų atsarginė kopija: išsaugokite visų modulių duomenis į vieną failą ir atkurkite juos kitoje naršyklėje ar kompiuteryje.">
<link rel="canonical" href="https://g-procure.com/atsargine-kopija.html">
<link rel="stylesheet" href="shared/epso-g.css">
<script src="shared/lang-detect.js"></script>
<script src="shared/backup.js"></script>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--font-base);color:var(--color-graphite);background:var(--color-graphite-5);line-height:1.6}
  .container{max-width:900px;margin:0 auto;padding:0 20px}

  .site-header{background:var(--color-white);border-bottom:1px solid var(--color-graphite-15)}
  .site-header__inner{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0}
  .brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
  .brand__logo{height:28px;width:auto;display:block}
  .brand__divider{width:1px;height:26px;background:var(--color-graphite-15)}
  .brand__product-name{font-size:17px;font-weight:800;letter-spacing:-0.01em;display:block}
  .brand__product-name em{color:var(--color-emerald);font-style:normal}
  .brand__product-tag{font-size:11px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;color:var(--color-graphite-50)}
  .site-header__actions{display:flex;align-items:center;gap:14px}
  .nav-link{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-size:14px;font-weight:600;color:var(--color-graphite)}
  .nav-link:hover{color:var(--color-emerald-120)}
  .nav-link__arrow{color:var(--color-emerald);font-weight:800}
  .lang-switch{display:flex;border:1px solid var(--color-graphite-15);border-radius:999px;overflow:hidden}
  .lang-switch__btn{border:0;background:transparent;font-family:inherit;font-size:12px;font-weight:700;
    padding:5px 11px;cursor:pointer;color:var(--color-graphite-50)}
  .lang-switch__btn[aria-pressed="true"]{background:var(--color-emerald);color:var(--color-white)}
  .lang-switch__btn:focus-visible{outline:2px solid var(--color-emerald);outline-offset:2px}

  .hero{background:var(--gradient-dark);color:var(--color-white);padding:40px 0 44px}
  .hero h1{font-size:30px;margin:0 0 10px;letter-spacing:-0.01em}
  .hero p{margin:0;max-width:70ch;color:rgba(255,255,255,0.88);font-size:15px}

  main{padding:28px 0 56px}
  .kortele{background:var(--color-white);border:1px solid var(--color-graphite-15);border-radius:var(--radius-lg);
    padding:22px;margin-bottom:18px;box-shadow:var(--shadow-subtle)}
  .kortele h2{font-size:17px;margin:0 0 6px}
  .kortele p.sub{margin:0 0 16px;color:var(--color-graphite-50);font-size:14px;max-width:72ch}

  table{width:100%;border-collapse:collapse;font-size:14px}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:0.04em;color:var(--color-graphite-50);
     border-bottom:2px solid var(--color-graphite-15);padding:8px 10px 8px 0}
  td{padding:9px 10px 9px 0;border-bottom:1px solid var(--color-graphite-5)}
  td.dydis,th.dydis{text-align:right;white-space:nowrap;padding-right:0}
  tr:last-child td{border-bottom:0}
  .raktas{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--color-graphite-50)}
  .suma{margin-top:14px;font-weight:700;font-size:14px}

  .mygtukai{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  button.veiksmas{background:var(--color-emerald);color:var(--color-white);border:0;border-radius:var(--radius-sm);
    padding:11px 20px;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;transition:background var(--transition-fast)}
  button.veiksmas:hover{background:var(--color-emerald-120)}
  button.veiksmas[disabled]{opacity:0.45;cursor:default}
  button.antrinis{background:var(--color-white);color:var(--color-graphite);border:1px solid var(--color-graphite-30)}
  button.antrinis:hover{background:var(--color-graphite-5);border-color:var(--color-graphite-50)}
  input[type="file"]{font-family:inherit;font-size:14px}

  .zinute{margin-top:14px;padding:12px 14px;border-radius:var(--radius-sm);font-size:14px;display:none}
  .zinute.rodoma{display:block}
  .zinute.gerai{background:var(--color-green-5);border:1px solid var(--color-green-15);color:var(--color-emerald-120)}
  .zinute.demesio{background:var(--color-warning-5);border:1px solid var(--color-warning);color:#7A5200}
  .zinute.klaida{background:var(--color-error-5);border:1px solid var(--color-error);color:#7F1722}

  .pastaba{font-size:13px;color:var(--color-graphite-50);margin-top:16px;max-width:74ch}
  .pastaba strong{color:var(--color-graphite)}
  footer{border-top:1px solid var(--color-graphite-15);background:var(--color-white);padding:20px 0;font-size:13px;color:var(--color-graphite-50)}
  @media (max-width:640px){
    .hero h1{font-size:24px}
    .brand__product-tag{display:none}
    .kortele{padding:18px}
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="container site-header__inner">
    <a class="brand" href="index.html">
      <img class="brand__logo" src="shared/img/epso-g-logo.svg" alt="EPSO-G" width="120" height="28">
      <span class="brand__divider" aria-hidden="true"></span>
      <div class="brand__product">
        <span class="brand__product-name">G-<em>Procure</em></span>
        <span class="brand__product-tag" data-lt="Pirkimų platforma" data-en="Procurement Platform"></span>
      </div>
    </a>
    <div class="site-header__actions">
      <nav class="site-nav" data-lt-aria="Pagrindinė navigacija" data-en-aria="Main navigation">
        <a class="nav-link" href="index.html">
          <span class="nav-link__arrow" aria-hidden="true">←</span>
          <span data-lt="Grįžti į pradžią" data-en="Back to home"></span>
        </a>
      </nav>
      <div class="lang-switch" role="group" aria-label="Kalba / Language">
        <button type="button" class="lang-switch__btn" data-lang="lt" aria-pressed="true">LT</button>
        <button type="button" class="lang-switch__btn" data-lang="en" aria-pressed="false">EN</button>
      </div>
    </div>
  </div>
</header>

<section class="hero">
  <div class="container">
    <h1 data-lt="Atsarginė duomenų kopija" data-en="Data backup"></h1>
    <p data-lt="G-Procure duomenys saugomi tik Jūsų naršyklėje, serveryje jų nėra. Todėl išvalyta naršyklė, kitas profilis ar naujas kompiuteris reiškia, kad darbas nebepasiekiamas. Šiame puslapyje visų modulių duomenis galima išsaugoti į vieną failą ir vėliau atkurti."
       data-en="G-Procure data is stored only in your browser, never on a server. Clearing the browser, switching profiles or moving to a new computer therefore leaves the work behind. Here you can save the data of every module into a single file and restore it later."></p>
  </div>
</section>

<main class="container">

  <section class="kortele" aria-labelledby="h-apzvalga">
    <h2 id="h-apzvalga" data-lt="Kas šiuo metu saugoma šioje naršyklėje" data-en="What this browser currently stores"></h2>
    <p class="sub" data-lt="Sąrašas sudaromas iš naršyklės saugyklos, tad matote tikrą būseną, o ne prielaidą."
       data-en="The list is read from browser storage, so it shows the real state, not an assumption."></p>
    <div id="apzvalga"></div>
  </section>

  <section class="kortele" aria-labelledby="h-issaugoti">
    <h2 id="h-issaugoti" data-lt="1. Išsaugoti kopiją" data-en="1. Save a backup"></h2>
    <p class="sub" data-lt="Atsisiunčiamas vienas JSON failas su visų modulių duomenimis. Failas lieka Jūsų kompiuteryje - niekur nesiunčiamas."
       data-en="Downloads a single JSON file containing the data of every module. The file stays on your computer and is not sent anywhere."></p>
    <div class="mygtukai">
      <button type="button" class="veiksmas" id="btn-issaugoti" data-lt="Atsisiųsti kopiją" data-en="Download backup"></button>
      <span id="issaugojimo-info" class="pastaba" style="margin-top:0"></span>
    </div>
  </section>

  <section class="kortele" aria-labelledby="h-atkurti">
    <h2 id="h-atkurti" data-lt="2. Atkurti iš kopijos" data-en="2. Restore from a backup"></h2>
    <p class="sub" data-lt="Pasirinkite anksčiau išsaugotą failą. Pirma parodysime, kas jame yra, ir tik tada, patvirtinus, duomenys bus įrašyti."
       data-en="Choose a previously saved file. Its contents are shown first, and the data is written only after you confirm."></p>
    <div class="mygtukai">
      <input type="file" id="failas" accept="application/json,.json" data-lt-aria="Atsarginės kopijos failas" data-en-aria="Backup file">
      <button type="button" class="veiksmas antrinis" id="btn-atkurti" disabled data-lt="Atkurti" data-en="Restore"></button>
    </div>
    <div class="zinute" id="perziura" role="status" aria-live="polite"></div>
    <p class="pastaba" data-lt="<strong>Svarbu:</strong> jei raktas yra ir faile, ir naršyklėje, įrašoma failo reikšmė. Kiti naršyklės duomenys lieka nepaliesti. Prieš atkuriant verta išsaugoti dabartinę kopiją."
       data-en="<strong>Important:</strong> if a key exists both in the file and in the browser, the file value wins. Other browser data is left untouched. It is worth saving a current backup before restoring."></p>
  </section>

  <p class="pastaba" data-lt="Duomenys niekada nepalieka naršyklės: šis puslapis neturi serverio dalies, o failas išsaugomas įprastu atsisiuntimu. Kopija tinka perkelti darbą į kitą kompiuterį - atidarykite šį puslapį ten ir atkurkite failą."
     data-en="The data never leaves the browser: this page has no server side and the file is saved as an ordinary download. A backup is also the way to move your work to another computer - open this page there and restore the file."></p>
</main>

<footer>
  <div class="container">
    <span data-lt="G-Procure · EPSO-G grupės pirkimų platforma" data-en="G-Procure · EPSO-G Group procurement platform"></span>
  </div>
</footer>

<script>
(function () {
  "use strict";

  /* ---------- Kalba (kaip kituose šakniniuose puslapiuose) ---------- */
  var KALBOS_RAKTAS = "gprocure-lang";
  var LANG = "lt";
  function aptikKalba() {
    if (window.GP_LANG) return GP_LANG.detect(KALBOS_RAKTAS);
    try { return localStorage.getItem(KALBOS_RAKTAS) === "en" ? "en" : "lt"; } catch (e) { return "lt"; }
  }
  function taikykKalba(lang) {
    LANG = lang;
    document.documentElement.setAttribute("lang", lang);
    var n = document.querySelectorAll("[data-lt]");
    for (var i = 0; i < n.length; i++) {
      var v = n[i].getAttribute("data-" + lang);
      if (v !== null) n[i].innerHTML = v;
    }
    var a = document.querySelectorAll("[data-lt-aria]");
    for (var j = 0; j < a.length; j++) {
      var av = a[j].getAttribute("data-" + lang + "-aria");
      if (av !== null) a[j].setAttribute("aria-label", av);
    }
    var b = document.querySelectorAll(".lang-switch__btn");
    for (var k = 0; k < b.length; k++) {
      b[k].setAttribute("aria-pressed", b[k].getAttribute("data-lang") === lang ? "true" : "false");
    }
    piesApzvalga();
  }
  document.addEventListener("click", function (e) {
    var btn = e.target.closest ? e.target.closest(".lang-switch__btn") : null;
    if (!btn) return;
    var lang = btn.getAttribute("data-lang");
    if (window.GP_LANG) GP_LANG.remember(KALBOS_RAKTAS, lang);
    taikykKalba(lang);
  });

  /* ---------- Saugykla ---------- */
  /* Logika gyvena shared/backup.js - čia tik sąsaja. */
  function visiIrasai() { return GP_BACKUP.irasai(); }
  function zenklas(raktas) { return GP_BACKUP.zenklas(raktas, LANG); }
  function dydis(b) {
    if (b < 1024) return b + " B";
    if (b < 1024 * 1024) return (b / 1024).toFixed(1).replace(".", ",") + " KB";
    return (b / 1024 / 1024).toFixed(2).replace(".", ",") + " MB";
  }

  function piesApzvalga() {
    var vieta = document.getElementById("apzvalga");
    if (!vieta) return;
    var irasai = visiIrasai();
    if (irasai === null) {
      vieta.innerHTML = "<p>" + (LANG === "en"
        ? "The browser does not allow access to local storage (private window or blocked site data)."
        : "Naršyklė neleidžia pasiekti saugyklos (privatus langas arba užblokuoti svetainės duomenys).") + "</p>";
      return;
    }
    if (!irasai.length) {
      vieta.innerHTML = "<p>" + (LANG === "en"
        ? "This browser holds no G-Procure data yet."
        : "Šioje naršyklėje G-Procure duomenų kol kas nėra.") + "</p>";
      document.getElementById("btn-issaugoti").disabled = true;
      return;
    }
    document.getElementById("btn-issaugoti").disabled = false;
    var viso = 0, eil = "";
    for (var i = 0; i < irasai.length; i++) {
      var z = zenklas(irasai[i].raktas);
      viso += irasai[i].baitai;
      eil += "<tr><td>" + z.pav + "</td><td>" + z.modulis +
             "</td><td class=\"raktas\">" + irasai[i].raktas +
             "</td><td class=\"dydis\">" + dydis(irasai[i].baitai) + "</td></tr>";
    }
    vieta.innerHTML =
      "<table><thead><tr><th>" + (LANG === "en" ? "Data" : "Duomenys") +
      "</th><th>" + (LANG === "en" ? "Module" : "Modulis") +
      "</th><th>" + (LANG === "en" ? "Key" : "Raktas") +
      "</th><th class=\"dydis\">" + (LANG === "en" ? "Size" : "Dydis") +
      "</th></tr></thead><tbody>" + eil + "</tbody></table>" +
      "<div class=\"suma\">" + (LANG === "en" ? "Total: " : "Iš viso: ") +
      irasai.length + (LANG === "en" ? " entries, " : " įrašai, ") + dydis(viso) + "</div>";
  }

  /* ---------- Išsaugojimas ---------- */
  document.getElementById("btn-issaugoti").addEventListener("click", function () {
    var data = new Date();
    var failas = GP_BACKUP.surinkti(null, data);
    if (!failas) return;
    var kiek = Object.keys(failas.items).length;
    if (!kiek) return;
    var blob = new Blob([JSON.stringify(failas, null, 1)], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = GP_BACKUP.failoVardas(data);
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
    document.getElementById("issaugojimo-info").textContent = LANG === "en"
      ? "Saved " + kiek + " entries (" + dydis(blob.size) + ")."
      : "Išsaugoti " + kiek + " įrašai (" + dydis(blob.size) + ").";
  });

  /* ---------- Atkūrimas ---------- */
  var paruosta = null;
  var perziura = document.getElementById("perziura");
  var btnAtkurti = document.getElementById("btn-atkurti");

  function rodyk(tipas, tekstas) {
    perziura.className = "zinute rodoma " + tipas;
    perziura.innerHTML = tekstas;
  }

  document.getElementById("failas").addEventListener("change", function (e) {
    paruosta = null; btnAtkurti.disabled = true;
    var f = e.target.files && e.target.files[0];
    if (!f) { perziura.className = "zinute"; return; }
    var fr = new FileReader();
    fr.onload = function () {
      var r = GP_BACKUP.patikrinti(fr.result);
      if (!r.ok) {
        rodyk("klaida", r.priezastis === "json"
          ? (LANG === "en" ? "This file is not readable JSON." : "Šis failas nėra skaitomas JSON.")
          : (LANG === "en" ? "This is not a G-Procure backup file." : "Tai ne G-Procure atsarginės kopijos failas."));
        return;
      }
      var obj = r.obj;
      var raktai = Object.keys(obj.items);
      var perrasomi = GP_BACKUP.perrasomi(obj, null);
      paruosta = obj;
      btnAtkurti.disabled = false;
      var data = (obj.createdAt || "").slice(0, 10);
      rodyk("demesio", LANG === "en"
        ? "File from <strong>" + data + "</strong>: " + raktai.length + " entries, of which <strong>" +
          perrasomi + "</strong> already exist in this browser and will be overwritten."
        : "Failas iš <strong>" + data + "</strong>: " + raktai.length + " įrašai, iš jų <strong>" +
          perrasomi + "</strong> šioje naršyklėje jau yra ir bus perrašyti.");
    };
    fr.readAsText(f);
  });

  btnAtkurti.addEventListener("click", function () {
    if (!paruosta) return;
    var raktai = Object.keys(paruosta.items);
    var klausimas = LANG === "en"
      ? "Restore " + raktai.length + " entries? Values with the same key will be replaced."
      : "Atkurti " + raktai.length + " įrašus? Tokio paties rakto reikšmės bus pakeistos.";
    if (!window.confirm(klausimas)) return;
    var r = GP_BACKUP.atkurti(paruosta, null);
    var ok = r.ok, blogai = r.blogai;
    piesApzvalga();
    if (blogai) {
      rodyk("klaida", LANG === "en"
        ? "Restored " + ok + " entries, " + blogai + " failed (storage may be full)."
        : "Atkurta " + ok + " įrašų, " + blogai + " nepavyko (saugykla gali būti pilna).");
    } else {
      rodyk("gerai", LANG === "en"
        ? "Restored " + ok + " entries. Open the module and check the data."
        : "Atkurta " + ok + " įrašų. Atidarykite modulį ir pasitikrinkite duomenis.");
    }
  });

  /* ---------- Start ---------- */
  if (window.GP_LANG && GP_LANG.markCanonical) GP_LANG.markCanonical();
  taikykKalba(aptikKalba());
})();
</script>
</body>
</html>
