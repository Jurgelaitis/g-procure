<style>
  /* Bendras išdėstymas - shared/dokumento-puslapis.css (kaip privatumo ir slapukų politikos); čia - tik šio puslapio elementai */
  p.sub{color:var(--color-graphite-50-strong);font-size:14px;margin:0 0 16px}

  /* Saugomų duomenų lentelė (piešia scenarijus #apzvalga): be langelių rėmelių, raktas - teksto šriftu (iki 2026-10-17 - lygiapločiu) */
  #apzvalga table{min-width:0;font-size:14px;line-height:1.5}
  #apzvalga th,#apzvalga td{border:0;background:none}
  #apzvalga th{font-size:12px;text-transform:uppercase;letter-spacing:0.04em;color:var(--color-graphite-50-strong);
     border-bottom:2px solid var(--color-graphite-15);padding:8px 10px 8px 0}
  #apzvalga td{padding:9px 10px 9px 0;border-bottom:1px solid var(--color-graphite-15)}
  #apzvalga td.dydis,#apzvalga th.dydis{text-align:right;white-space:nowrap;padding-right:0}
  #apzvalga tr:last-child td{border-bottom:0}
  #apzvalga td:nth-child(2){white-space:nowrap}   /* modulio pavadinimas nelūžta per brūkšnelį („PP- / salygos“) */
  .raktas{font-size:13px;color:var(--color-graphite-50-strong);overflow-wrap:anywhere}   /* 320 px: ilgas raktas lūžta, lentelė neplečia puslapio */
  .suma{margin-top:14px;font-weight:700;font-size:14px}

  .mygtukai{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  button.veiksmas{background:var(--color-emerald-strong);color:var(--color-white);border:0;border-radius:var(--radius-sm);
    padding:11px 20px;font-family:inherit;font-weight:700;font-size:16px;cursor:pointer;transition:background var(--transition-fast)}
  button.veiksmas:hover{background:var(--color-emerald-strong-hover)}
  button.veiksmas[disabled]{opacity:0.45;cursor:default}
  button.antrinis{background:var(--color-white);color:var(--color-graphite);border:1px solid var(--color-graphite-30)}
  button.antrinis:hover{background:var(--color-graphite-5);border-color:var(--color-graphite-50)}
  input[type="file"]{font-family:inherit;font-size:14px;max-width:100%}

  .zinute{margin-top:14px;padding:12px 14px;border-radius:var(--radius-sm);font-size:14px;display:none}
  .zinute.rodoma{display:block}
  .zinute ul{margin:8px 0 0;padding-left:20px}
  .zinute li{margin:4px 0}
  .zinute .veiksmas{margin-top:10px}
  .trinti{font:inherit;font-size:13px;padding:2px 8px;border:1px solid var(--color-graphite-30);border-radius:var(--radius-sm);background:var(--color-white);color:var(--color-graphite);cursor:pointer}
  .zinute.gerai{background:var(--color-green-5);border:1px solid var(--color-green-15);color:var(--color-emerald-strong)}
  .zinute.demesio{background:var(--color-warning-5);border:1px solid var(--color-warning);color:#7A5200}
  .zinute.klaida{background:var(--color-error-5);border:1px solid var(--color-error);color:#7F1722}

  .pastaba{margin-top:16px}
  .pastaba strong{color:var(--color-graphite)}
</style>

<section class="hero">
  <div class="container">
    <h1 data-lt="Atsarginė duomenų kopija" data-en="Data backup"></h1>
    <p data-lt="G-Procure duomenys saugomi tik Jūsų naršyklėje, serveryje jų nėra. Todėl išvalyta naršyklė, kitas profilis ar naujas kompiuteris reiškia, kad darbas nebepasiekiamas. Šiame puslapyje visų modulių duomenis galima išsaugoti į vieną failą ir vėliau atkurti."
       data-en="G-Procure data is stored only in your browser, never on a server. Clearing the browser, switching profiles or moving to a new computer therefore leaves the work behind. Here you can save the data of every module into a single file and restore it later."></p>
  </div>
</section>

<main class="container">

       data-en="The list is read from browser storage, so it shows the real state, not an assumption."></p>
    <div id="apzvalga"></div>
  </section>

  <section class="kortele" aria-labelledby="h-issaugoti">
    <h2 id="h-issaugoti" data-lt="1. Išsaugoti kopiją" data-en="1. Save a backup"></h2>
    <p class="sub" data-lt="Atsisiunčiamas vienas JSON failas su visų modulių duomenimis. Failas lieka Jūsų kompiuteryje - niekur nesiunčiamas."
       data-en="Downloads a single JSON file containing the data of every module. The file stays on your computer and is not sent anywhere."></p>
    <div class="mygtukai">
      <button type="button" class="veiksmas" id="btn-issaugoti" data-lt="Atsisiųsti kopiją" data-en="Download backup"></button>
      <span id="issaugojimo-info" class="pastaba" style="margin-top:0"></span>
    </div>
  </section>

  <section class="kortele" aria-labelledby="h-atkurti">
    <h2 id="h-atkurti" data-lt="2. Atkurti iš kopijos" data-en="2. Restore from a backup"></h2>
    <p class="sub" data-lt="Pasirinkite anksčiau išsaugotą failą. Pirma parodysime, kas jame yra, ir tik tada, patvirtinus, duomenys bus įrašyti."
       data-en="Choose a previously saved file. Its contents are shown first, and the data is written only after you confirm."></p>
    <div class="mygtukai">
      <input type="file" id="failas" accept="application/json,.json" data-lt-aria="Atsarginės kopijos failas" data-en-aria="Backup file">
      <button type="button" class="veiksmas antrinis" id="btn-atkurti" disabled data-lt="Atkurti" data-en="Restore"></button>
    </div>
    <div class="zinute" id="perziura" role="status" aria-live="polite"></div>
    <p class="pastaba" data-lt="<strong>Svarbu:</strong> jei raktas yra ir faile, ir naršyklėje, įrašoma failo reikšmė. Kiti naršyklės duomenys lieka nepaliesti. Prieš atkuriant verta išsaugoti dabartinę kopiją."
       data-en="<strong>Important:</strong> if a key exists both in the file and in the browser, the file value wins. Other browser data is left untouched. It is worth saving a current backup before restoring."></p>
  </section>

  <p class="pastaba" data-lt="Duomenys niekada nepalieka naršyklės: šis puslapis neturi serverio dalies, o failas išsaugomas įprastu atsisiuntimu. Kopija tinka perkelti darbą į kitą kompiuterį - atidarykite šį puslapį ten ir atkurkite failą."
     data-en="The data never leaves the browser: this page has no server side and the file is saved as an ordinary download. A backup is also the way to move your work to another computer - open this page there and restore the file."></p>

<script>
(function () {
  "use strict";

  /* ---------- Kalba (kaip kituose šakniniuose puslapiuose) ---------- */
  var KALBOS_RAKTAS = "gprocure-lang";
  var LANG = "lt";
  function aptikKalba() {
    if (window.GP_LANG) return GP_LANG.detect(KALBOS_RAKTAS);
    try { return localStorage.getItem(KALBOS_RAKTAS) === "en" ? "en" : "lt"; } catch (e) { return "lt"; }
  }
  function taikykKalba(lang) {
    LANG = lang;
    document.documentElement.setAttribute("lang", lang);
    var n = document.querySelectorAll("[data-lt]");
    for (var i = 0; i < n.length; i++) {
      var v = n[i].getAttribute("data-" + lang);
      if (v !== null) n[i].innerHTML = v;
    }
    var a = document.querySelectorAll("[data-lt-aria]");
    for (var j = 0; j < a.length; j++) {
      var av = a[j].getAttribute("data-" + lang + "-aria");
      if (av !== null) a[j].setAttribute("aria-label", av);
    }
    var b = document.querySelectorAll(".lang-switch__btn");
    for (var k = 0; k < b.length; k++) {
      b[k].setAttribute("aria-pressed", b[k].getAttribute("data-lang") === lang ? "true" : "false");
    }
    piesApzvalga();
  }
  document.addEventListener("click", function (e) {
    var btn = e.target.closest ? e.target.closest(".lang-switch__btn") : null;
    if (!btn) return;
    var lang = btn.getAttribute("data-lang");
    if (window.GP_LANG) GP_LANG.remember(KALBOS_RAKTAS, lang);
    taikykKalba(lang);
  });

  /* ---------- Saugykla ---------- */
  /* Logika gyvena shared/backup.js - čia tik sąsaja. */
  function visiIrasai() { return GP_BACKUP.irasai(); }
  /* Raktai ir failo laukai - nepatikimi duomenys (kopijos failą galėjo paruošti bet kas): į HTML tik ekranuoti. */
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function zenklas(raktas) { return GP_BACKUP.zenklas(raktas, LANG); }
  function dydis(b) {
    if (b < 1024) return b + " B";
    if (b < 1024 * 1024) return (b / 1024).toFixed(1).replace(".", ",") + " KB";
    return (b / 1024 / 1024).toFixed(2).replace(".", ",") + " MB";
  }

  /* Lietuviški linksniai skaičiui (2026-11-06: iki tol „1 įrašai“, „Atkurta 1 įrašų“) */
  function sk(n, v1, v2, v3) {
    if (LANG === "en") return n + " " + (n === 1 ? v1 : v2);
    var d = n % 10, s = n % 100;
    return n + " " + (d === 1 && s !== 11 ? v1 : d >= 2 && d <= 9 && (s < 12 || s > 19) ? v2 : v3);
  }
  function irasu(n) { return LANG === "en" ? sk(n, "entry", "entries") : sk(n, "įrašas", "įrašai", "įrašų"); }
  function atsisiusk() {
    var data = new Date();
    var failas = GP_BACKUP.surinkti(null, data);
    if (!failas) return null;
    var kiek = Object.keys(failas.items).length;
    if (!kiek) return null;
    var blob = new Blob([JSON.stringify(failas, null, 1)], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = GP_BACKUP.failoVardas(data);
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
    if (window.GP_ANALITIKA) GP_ANALITIKA.ivykis("atsargine_kopija", { veiksmas: "issaugota", rezultatas: "pavyko" });
    return { kiek: kiek, dydis: blob.size };
  }

  function piesApzvalga() {
    var vieta = document.getElementById("apzvalga");
    if (!vieta) return;
    var irasai = visiIrasai();
    if (irasai === null) {
      vieta.innerHTML = "<p>" + (LANG === "en"
        ? "The browser does not allow access to local storage (private window or blocked site data)."
        : "Naršyklė neleidžia pasiekti saugyklos (privatus langas arba užblokuoti svetainės duomenys).") + "</p>";
      return;
    }
    if (!irasai.length) {
      vieta.innerHTML = "<p>" + (LANG === "en"
        ? "This browser holds no G-Procure data yet."
        : "Šioje naršyklėje G-Procure duomenų kol kas nėra.") + "</p>";
      document.getElementById("btn-issaugoti").disabled = true;
      return;
    }
    document.getElementById("btn-issaugoti").disabled = false;
    var viso = 0, eil = "";
    for (var i = 0; i < irasai.length; i++) {
      var z = zenklas(irasai[i].raktas);
      viso += irasai[i].baitai;
      /* Neperskaitomo įrašo kopiją galima ištrinti (2026-11-06): kitaip ji liktų visam laikui */
      var trn = irasai[i].raktas.indexOf(".sugadinta-") > 0
        ? " <button type=\"button\" class=\"trinti\" data-trinti=\"" + esc(irasai[i].raktas) + "\" aria-label=\"" + (LANG === "en" ? "Delete " : "Ištrinti ") + esc(z.pav) + "\">" + (LANG === "en" ? "Delete" : "Ištrinti") + "</button>" : "";
      eil += "<tr><td>" + esc(z.pav) + trn + "</td><td>" + z.modulis +
             "</td><td class=\"raktas\">" + esc(irasai[i].raktas) +
             "</td><td class=\"dydis\">" + dydis(irasai[i].baitai) + "</td></tr>";
    }
    vieta.innerHTML =
      "<table><thead><tr><th>" + (LANG === "en" ? "Data" : "Duomenys") +
      "</th><th>" + (LANG === "en" ? "Module" : "Modulis") +
      "</th><th>" + (LANG === "en" ? "Key" : "Raktas") +
      "</th><th class=\"dydis\">" + (LANG === "en" ? "Size" : "Dydis") +
      "</th></tr></thead><tbody>" + eil + "</tbody></table>" +
      "<div class=\"suma\">" + (LANG === "en" ? "Total: " : "Iš viso: ") +
      irasu(irasai.length) + ", " + dydis(viso) + "</div>";
  }
  document.getElementById("apzvalga").addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest("[data-trinti]") : null;
    if (!b) return;
    var k = b.getAttribute("data-trinti");
    if (!window.confirm(LANG === "en"
      ? "Delete this unreadable copy permanently? It will not be in new backups. Download a backup first if you may still need it."
      : "Ištrinti šią neperskaitomą kopiją visam laikui? Naujose atsarginėse kopijose jos nebebus. Jei jos dar gali prireikti, pirma atsisiųskite kopiją.")) return;
    try { localStorage.removeItem(k); } catch (err) {}
    piesApzvalga();
  });

  /* ---------- Išsaugojimas ---------- */
  document.getElementById("btn-issaugoti").addEventListener("click", function () {
    var r = atsisiusk();
    if (!r) return;
    document.getElementById("issaugojimo-info").textContent = (LANG === "en" ? "Saved: " : "Išsaugota: ") + irasu(r.kiek) + " (" + dydis(r.dydis) + ").";
  });

  /* ---------- Atkūrimas ---------- */
  var paruosta = null, paruostaPal = [];
  var perziura = document.getElementById("perziura");
  var btnAtkurti = document.getElementById("btn-atkurti");

  function rodyk(tipas, tekstas) {
    perziura.className = "zinute rodoma " + tipas;
    perziura.innerHTML = tekstas;
  }

  document.getElementById("failas").addEventListener("change", function (e) {
    paruosta = null; paruostaPal = []; btnAtkurti.disabled = true;
    var f = e.target.files && e.target.files[0];
    if (!f) { perziura.className = "zinute"; return; }
    var fr = new FileReader();
    fr.onload = function () {
      var r = GP_BACKUP.patikrinti(fr.result);
      if (!r.ok) {
        var zin, kurie = function (vardais) {
          return esc(r.raktai.slice(0, 3).map(function (k) { return vardais ? zenklas(k).pav : k; }).join(", ")) +
            (r.raktai.length > 3 ? (LANG === "en" ? " and " + (r.raktai.length - 3) + " more" : " ir dar " + (r.raktai.length - 3)) : "");
        };
        if (r.priezastis === "json") zin = LANG === "en" ? "This file is not readable JSON." : "Šis failas nėra skaitomas JSON.";
        else if (r.priezastis === "reiksmes") {
          zin = LANG === "en"
            ? "Some entries in this file do not hold text values, so the file cannot be restored - existing data has not been changed. Entries: " + kurie() + "."
            : "Kai kurių šio failo įrašų reikšmės nėra tekstas, todėl failo atkurti negalima - esami duomenys nepakeisti. Įrašai: " + kurie() + ".";
        } else if (r.priezastis === "sugadinta") {
          zin = LANG === "en"
            ? "Some data in this file are damaged (cut off or edited by hand), so the file cannot be restored - existing data has not been changed. Damaged: " + kurie(true) + "."
            : "Dalis šio failo duomenų sugadinti (nukirpti ar taisyti ranka), todėl failo atkurti negalima - esami duomenys nepakeisti. Sugadinti: " + kurie(true) + ".";
        } else if (r.priezastis === "versija") {
          zin = LANG === "en"
            ? "This backup was made by a newer G-Procure version (format " + esc(r.versija) + ") that this page does not know - existing data has not been changed."
            : "Šią kopiją sukūrė naujesnė G-Procure versija (formatas " + esc(r.versija) + "), kurios šis puslapis nežino - esami duomenys nepakeisti.";
        } else zin = LANG === "en" ? "This is not a G-Procure backup file." : "Tai ne G-Procure atsarginės kopijos failas.";
        rodyk("klaida", zin);
        return;
      }
      var obj = r.obj;
      var pal = GP_BACKUP.palyginimas(obj, null);
      paruosta = obj; paruostaPal = pal;
      btnAtkurti.disabled = false;
      // Vietinė data, kaip failo varde (createdAt - UTC: 00:00-03:00 Lietuvos laiku būtų vakarykštė)
      var sukurta = new Date(obj.createdAt ? obj.createdAt : NaN), p2 = function (n) { return (n < 10 ? "0" : "") + n; };   // null - ne 1970-01-01
      var data = isNaN(sukurta) ? esc(String(obj.createdAt || "").slice(0, 10))
        : sukurta.getFullYear() + "-" + p2(sukurta.getMonth() + 1) + "-" + p2(sukurta.getDate());
      /* Kas bus su kiekvienos rūšies duomenimis (2026-11-06): pakeista, pridėta, nepasikeis; ir kurių šios naršyklės įrašų (kortelių,
         pirkimų) faile nėra - jie dingtų. Iki tol - tik „N įrašų bus perrašyti“, o vėliau sukurtos kortelės dingdavo be įspėjimo. */
      var grupes = { pakeis: [], naujas: [], "tas pats": [], praleidziamas: [] }, praras = [];
      pal.forEach(function (x) {
        var z = zenklas(x.raktas), pav = z.pav + (z.modulis && z.modulis !== "-" ? " (" + z.modulis + ")" : "");
        if (grupes[x.busena].indexOf(pav) < 0) grupes[x.busena].push(pav);
        if (x.prarandami.length) praras.push({ pav: z.pav, sar: x.prarandami });
      });
      var h = (LANG === "en" ? "File from <strong>" + data + "</strong>." : "Failas iš <strong>" + data + "</strong>.") + "<ul>";
      var eil = function (lt, en, sar) { if (sar.length) h += "<li><strong>" + (LANG === "en" ? en : lt) + ":</strong> " + esc(sar.join(", ")) + "</li>"; };
      eil("Bus pakeista failo duomenimis", "Will be replaced by the file data", grupes.pakeis);
      eil("Bus pridėta", "Will be added", grupes.naujas);
      eil("Nepasikeis (tokie patys)", "Will not change (the same)", grupes["tas pats"]);
      eil("Neatkuriama (lieka šios naršyklės)", "Not restored (this browser's stays)", grupes.praleidziamas);
      h += "</ul>";
      praras.forEach(function (x) {
        var vardai = x.sar.slice(0, 5).map(function (y) { return "„" + y.pav + "“"; }).join(", ") + (x.sar.length > 5 ? (LANG === "en" ? " and " + (x.sar.length - 5) + " more" : " ir dar " + (x.sar.length - 5)) : "");
        h += "<p><strong>" + esc(x.pav) + (LANG === "en" ? " - would be lost on restore (" + x.sar.length + "):" : " - atkūrus būtų prarasta (" + x.sar.length + "):") + "</strong> " +
          esc(vardai) + ". " + (LANG === "en" ? "They are in this browser but not in the file." : "Jie yra šioje naršyklėje, bet ne faile.") + "</p>";
      });
      if (grupes.pakeis.length) h += "<p>" + (LANG === "en" ? "To keep the current data, download a copy of them first." : "Kad dabartiniai duomenys neprapultų, pirma atsisiųskite jų kopiją.") +
        "</p><button type=\"button\" class=\"veiksmas antrinis\" id=\"btn-dabartine\">" + (LANG === "en" ? "Download a copy of the current data" : "Atsisiųsti dabartinių duomenų kopiją") + "</button>";
      rodyk(praras.length ? "klaida" : "demesio", h);
      var bd = document.getElementById("btn-dabartine");
      if (bd) bd.addEventListener("click", function () {
        var r2 = atsisiusk();
        if (r2) document.getElementById("issaugojimo-info").textContent = (LANG === "en" ? "Saved: " : "Išsaugota: ") + irasu(r2.kiek) + " (" + dydis(r2.dydis) + ").";
      });
    };
    fr.readAsText(f);
  });

  btnAtkurti.addEventListener("click", function () {
    if (!paruosta) return;
    /* Klausimas sako, kas bus pakeista ir kas prarasta (2026-11-06) */
    var pak = paruostaPal.filter(function (x) { return x.busena === "pakeis"; }).length;
    var pr = [];
    paruostaPal.forEach(function (x) { if (x.prarandami.length) pr.push(zenklas(x.raktas).pav + " - " + irasu(x.prarandami.length)); });
    var klausimas = (LANG === "en" ? "Restore the data from the file? " : "Atkurti duomenis iš failo? ") +
      (pak ? (LANG === "en" ? "Current data will be replaced: " : "Bus pakeista dabartinių duomenų: ") + sk(pak, LANG === "en" ? "type" : "rūšis", LANG === "en" ? "types" : "rūšys", "rūšių") + ". " : "") +
      (pr.length ? (LANG === "en" ? "Lost (not in the file): " : "Bus prarasta (faile nėra): ") + pr.join("; ") + "." : "");
    if (!window.confirm(klausimas)) return;
    var r = GP_BACKUP.atkurti(paruosta, null);
    var ok = r.ok, blogai = r.blogai;
    if (window.GP_ANALITIKA) GP_ANALITIKA.ivykis("atsargine_kopija", { veiksmas: "atkurta", rezultatas: blogai ? "klaida" : "pavyko" });
    piesApzvalga();
    if (blogai) {
      // Kurie duomenys neatkurti (iki 2026-09-28 - tik skaičius): pavadinimai žmogui, pasikartojantys - vieną kartą
      var kas = [];
      (r.nepavyko || []).forEach(function (k) {
        var z = zenklas(k), t = z.pav + (z.modulis && z.modulis !== "-" ? " (" + z.modulis + ")" : "");
        if (kas.indexOf(t) < 0) kas.push(t);
      });
      rodyk("klaida", LANG === "en"
        ? "Restored: " + irasu(ok) + ", failed: " + blogai + " (storage may be full): " + esc(kas.join(", ")) + "."
        : "Atkurta: " + irasu(ok) + ", nepavyko: " + blogai + " (saugykla gali būti pilna): " + esc(kas.join(", ")) + ".");
    } else {
      rodyk("gerai", LANG === "en"
        ? "Restored: " + irasu(ok) + ". Open the module and check the data." + (r.praleista && r.praleista.length ? " Your cookie decision in this browser was not changed." : "")
        : "Atkurta: " + irasu(ok) + ". Atidarykite modulį ir pasitikrinkite duomenis." + (r.praleista && r.praleista.length ? " Jūsų sprendimas dėl slapukų šioje naršyklėje nepakeistas." : ""));
    }
  });

  /* ---------- Start ---------- */
  if (window.GP_LANG && GP_LANG.markCanonical) GP_LANG.markCanonical();
  taikykKalba(aptikKalba());
})();
</script>
